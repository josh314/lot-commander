<div class="container">
	<div class="row">
		<div class="col-xs-12">
			<div class="panel panel-default">
				<div class="panel-heading">
					<h3 class="panel-title">Lot Details</h3> 
				</div>
				<div class="panel-body">
					<b>Handle: </b>{{ lot.getHandle() }}<br>
					<b>Description: </b>{{ lot.getDescription() }}<br>
					<b>SKU count: </b>{{ lot.getNumSku() }}<br>
					<b>Inventory count: </b>{{ lot.getInventoryTotal() }}<br>
					<div class="pull-right">
						<button class="btn btn-danger" ng-click="editLot()">Edit <span class="glyphicon glyphicon-pencil"></span></button>
					</div>
					<b>Status: </b>{{ lot.getStatus() }}<br>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="well">
			<h4>Manifest</h4>
			<table class="table table-striped">
				<thead><tr>
					<th>Barcode</th>
					<th>Quantity</th>
				</tr></thead>
				<tbody>
					<tr ng-repeat="item in lot.getInventory()">
						<td>{{item.barcode}}</td>
						<td>{{item.quantity}}</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>	
</div>
