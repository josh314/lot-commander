<div class="container" id="contact">
	<div class="row well">
		<h2>Lots</h2>
		<div class="form-group col-xs-12 col-sm-4">
			<label for="lotStatusFilter">Filter on Status</label>
			<select class="form-control" name="lotStatusFilter" ng-model="lotStatus" ng-change="update()">
				<option ng-repeat="status in statusOptions">{{status}}</option>
			</select>
		</div>
		<table class="table table-striped">
			<thead><tr>
				<th>Handle</th>
				<th>Total Units</th>
				<th>Created</th>
				<th>Last Updated</th>
				<th>Status</th>
				<th></th>
				<th></th>
			</tr></thead>
			<tbody>	
				<tr ng-repeat="lot in lots">
					<td><a ng-href="lots/view/{{lot._id}}">{{lot.handle}}</a></td>
				    <td>{{lot.totalUnits ? lot.totalUnits : '---'}}</td>
				    <td>{{lot.readableCreatedAt}}</td>
				    <td>{{lot.readableUpdatedAt}}</td>
				    <td>{{lot.status}}</td>
	                <td><button class="btn btn-success btn-xs" ng-click="scanItems(lot._id)">Scan Items</button></td>
	                <td><button class="btn btn-success btn-xs" ng-click="requestFile(lot)">Create Manifest File</button></td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
