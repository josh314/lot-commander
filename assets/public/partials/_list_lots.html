<div class="container" id="contact">
	<div class="row well">
		<h2>Lots</h2>
		<table class="table table-striped">
			<thead><tr>
				<th>Handle</th>
				<th>Total Units</th>
				<th>Last Updated</th>
				<th></th>
				<th></th>
			</tr></thead>
			<tbody>	
				<tr ng-repeat="lot in lots">
					<td><a ng-href="view/{{lot._id}}">{{lot.handle}}</a></td>
				    <td>{{lot.totalUnits ? lot.totalUnits : '---'}}</td>
				    <td>{{lot.readableUpdatedAt}}</td>
	                <td><button class="btn btn-success btn-xs" ng-click="scanItems(lot._id)">Scan Items</button></td>
	                <td><button class="btn btn-success btn-xs" ng-click="requestFile(lot)">Create Manifest File</button></td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
