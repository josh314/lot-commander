<div class="modal-header">
	<h3 class="modal-title" ng-class="messageSeverity">{{message.header}}</h3>
</div>
<div class="modal-body">
	<div class="row">
		<div class="col-xs-12">
			<p>{{message.body}}</p>
		</div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-success" type="button" ng-click="$dismiss()">Close</button>
</div>
