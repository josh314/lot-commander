<div class="modal-header">
	<h3 class="modal-title">Edit Lot Metadata</h3>
</div>
<div class="modal-body">
	<div class="row">
		<div class="form-group col-xs-12 col-sm-6">
			<label for="handleInput">Handle</label>
			<input class="form-control" name="handle" id="handleInput" required ng-model="lot.handle">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="typeInput">Type</label>
			<select class="form-control" name="type" id="typeInput" required ng-model="lot.type">
				<option ng-repeat="type in lotTypeEnum">{{type}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="descriptionInput">Description</label>
			<input class="form-control" name="description" id="descriptionInput" required ng-model="lot.description">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="statusInput">Status</label>
			<select class="form-control" name="status" id="statusInput" required ng-model="lot.status">
				<option ng-repeat="status in lotStatusEnum">{{status}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6" ng-show="lot.unmanifested">
			<label for="totalUnitsInput">Total Units</label>
			<input class="form-control" id="totalUnitsInput" required ng-model="lot.totalUnits">
		</div>
<!-- 		<div class="form-group col-xs-12">
			<label for="listingBodyInput">Listing Body</label>
			<input type="textarea" class="form-control" name="listingBody" id="listingBodyInput" required ng-model="listing.body">
		</div> -->
		<div class="col-xs-12">
			<h3>Listings</h3>
			<label>Title</label>
			<input class="form-control" name="listingTitle" id="listingTitleinput" ng-model="lot.listingData.title">
			<div>
				<label>Body (boilerplate omitted)</label>
				<textarea rows="15" class="form-control" name="listingBody" id="listingBodyInput" required ng-model="lot.listingData.body"></textarea>
			</div>
		</div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close(lot)">Save edit data</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
