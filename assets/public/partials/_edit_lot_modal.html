<div class="modal-header">
	<h3 class="modal-title">Edit Lot Metadata</h3>
</div>
<div class="modal-body">
	<div class="row">
		<div class="form-group col-xs-12 col-sm-6">
			<label for="handleInput">Handle</label>
			<input class="form-control" class="form-control" name="handle" id="handleInput" required ng-model="lot.handle">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="descriptionInput">Description</label>
			<input class="form-control" class="form-control" name="description" id="descriptionInput" required ng-model="lot.description">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="handleInput">Status</label>
			<select class="form-control" class="form-control" name="handle" id="handleInput" required ng-model="lot.status">
				<option ng-repeat="status in lotStatusEnum">{{status}}</option>
			</select>
		</div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close(lot)">Save edit data</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
