<div class="container">
	<div class="row well">
		<h2>New Manifest</h2>
		<div class="col-xs-12">
		    <form name="newManifestForm">
				<div class="row">
					<div class="form-group" ng-class="{ 'has-error' : noHandleSubmitted }">
						<label for="handleInput">Handle (required)</label>
						<input type="text" class="form-control" name="handle" id="handleInput" ng-model="handle" autocomplete="off" autofocus>
						<span class="text-danger h4" ng-show="noHandleSubmitted">No Handle submitted.</span>
					</div>
					<div class="form-group">
						<label for="descInput">Description (optional)</label>
						<input type="text" class="form-control" name="handle" id="descInput" ng-model="desc" autocomplete="off">
					</div>
		            <div>
						<input class="btn btn-success" type="submit" ng-click="startManifest()" value="Search">
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
