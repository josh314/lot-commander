<div class="container">
	<h3>Scan Manifest Items</h3>
	<div class="row well">
		<div class="col-xs-12">
		    <form name="scanForm">
				<div class="row">
					<div class="form-group" ng-class="{ 'has-error' : (scanForm.barcode.$invalid && !scanForm.barcode.$pristine) || barcodeNotFound || networkError}">
						<label for="barcodeInput">Scan Barcode here</label>
						<input type="text" class="form-control" name="barcode" id="barcodeInput" ng-model="scannedBarcode" ng-keyup="$event.keyCode == 13 && scanBarcode()" autocomplete="off" ng-pattern="'[0-9]{8,15}'" autofocus>
						<span class="text-danger h4" ng-show="scanForm.barcode.$invalid && !scanForm.barcode.$pristine">Invalid Barcode Format</span>
					</div>
				</div>
			</form>
		</div>
	</div>
	
	<div class="row">
		<div class="well">
			<h3> Manifest Details</h3>
			<div class="col-xs-6">
				<dl class="dl-horizontal pull-left">
					<dt>Handle</dt><dd>{{ lot.getHandle() }}</dd>
					<dt>Description</dt><dd>{{ lot.getDescription() }}</dd>
					<dt>SKU count</dt><dd>{{ lot.getNumSku() }}</dd>
					<dt>Inventory count</dt><dd>{{ lot.getInventoryTotal() }}</dd>
				</dl>
			</div>
			<div class="col-xs-2 pull-right"><a class="btn btn-success btn-lg" ng-click="saveManifest()">Save</a></div>
			<table class="table table-striped">
				<thead><tr>
					<th>Barcode</th>
					<th>Title</th>
					<th>Quantity</th>
					<th>Price</th>
					<th>Decrease Quantity</th>
				</tr></thead>
				<tbody>
					<tr ng-repeat="item in lot.getInventory()">
<!-- 						<td>{{item.barcode}}</td>
						<td>{{item.description}}</td>
						<td>{{item.quantity}}</td>
						<td>{{item.price}}</td>
						<td><button class="btn btn-danger btn-xs" ng-click="decrementInventory(item.barcode)"><span class="glyphicon glyphicon-arrow-down"></span></button></td> -->
						<td><input type="text" size=16 ng-model="item.barcode"></td>
						<td><input type="text" size="64" ng-model="item.description"></td>
						<td><input type="number" style="width: 4em" ng-model="item.quantity" min="0"></td>
						<td><input type="text" size="6" ng-model="item.price"></td>
						<td><button class="btn btn-danger btn-xs" ng-click="lot.deleteProduct(item.barcode)"><span class="glyphicon glyphicon-remove"></span></button></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="col-xs-6"><a class="btn btn-success btn-lg" ng-click="saveManifest()">Save</a></div>
	</div>	
</div>
