<div class="container" id="contact">
	<div class="row well">
		<h2>Auctions</h2>
		<div class="form-group col-xs-12 col-sm-6">
			<select class="form-control" ng-model="auctionStatus" ng-change="update()">
				<option ng-repeat="status in auctionStatusOptions">{{status}}</option>
			</select>
		</div>
		<table class="table table-striped">
			<thead><tr>
				<th>Lot ID</th>
				<th>Total Units</th>
				<th>Created</th>
				<th>End date</th>
			</tr></thead>
			<tbody>
				<tr ng-repeat="auction in auctions">
					<td><a ng-href="lots/view/{{auction.lot_id}}">{{auction.lot_id}}</a></td>
				    <td>{{lot.totalUnits ? lot.totalUnits : '---'}}</td>
				    <td>{{lot.readableCreatedAt}}</td>
				    <td>{{auction.readableEndDate}}</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
