<div class="container">

	<div class="col-xs-12 col-sm-6 col-sm-offset-3">

		<h1><span class="fa fa-sign-in"></span> Change Password</h1>
		<div class="well">
			<h4>Guidlines</h4>
			<ul>
				<li>You may use letters, punctuation or numbers</li>
				<li>Passwords must be at least 20 characters long</li>
			</ul>
		</div>
		<form>
			<div class="form-group">
				<label>New Password</label>
				<input type="password" class="form-control" ng-model="password">
        		<span class="text-danger h4" ng-show="passwordInvalid">Password not valid!</span>
			</div>
	        <div class="form-group">
	            <label>Confirm Password</label>
	            <input type="password" class="form-control" ng-model="confirmPassword">
        		<span class="text-danger h4" ng-show="passwordMismatch">Password fields do not match!</span>
	        </div>
			<button type="submit" class="btn btn-warning btn-lg" ng-click="submitPasswordChange()">Submit</button>
		</form>
	</div>
</div>
