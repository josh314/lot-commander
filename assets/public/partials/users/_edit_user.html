<div class="container">

	<div class="col-sm-6 col-sm-offset-3">

	    <h1><span class="fa fa-sign-in"></span> Edit user: <strong>{{selectedUser.username}}</strong></h1>

	    <form action='/api/users/edit-role' method="post">
	        <div class="form-group">
	            <label>Role</label>
	            <select class="form-control" ng-model="newUserRole" name="role">
		            <option ng-repeat="role in userRoles">{{role}}</option>
	            </select>
	        </div>
	        <div class="form-group">
	            <label>Username</label>
	            <input type="text" class="form-control" name="username" ng-model="selectedUser.username">
	        </div>
	        <button type="submit" class="btn btn-warning btn-sm">Change role</button>
	    </form>
	</div>

</div>
