<div class="container">
	<div class="row well">
		<h2>New Manifest</h2>
		<div class="col-xs-12">
		    <form name="newLotForm">
				<div class="row">
					<div class="form-group" ng-class="{ 'has-error' : noLotIdSubmitted }">
						<label for="lotIdInput">Lot ID (required)</label>
						<input type="text" class="form-control" name="lotId" id="lotIdInput" ng-model="lotId" autocomplete="off" autofocus>
						<span class="text-danger h4" ng-show="noLotIdSubmitted">No Lot Id submitted.</span>
					</div>
					<div class="form-group">
						<label for="descInput">Description (optional)</label>
						<input type="text" class="form-control" name="lotId" id="descInput" ng-model="desc" autocomplete="off">
					</div>
		            <div>
						<input class="btn btn-success" type="submit" ng-click="startLot()" value="Search">
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
