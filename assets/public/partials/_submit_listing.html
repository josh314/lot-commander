<div class="container">
	<div class="row well" ng-hide="waitingForResponse">
		<h2>Listing Details</h2>
		<div class="col-xs-12">
			<div class="row">
				<div class="row">
					<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error': noMarketplace }">
						<label for="marketplaceInput">Marketplace</label>
						<select class="form-control" name="marketplace" id="marketplaceInput" ng-model="listing.marketplace">
							<option ng-repeat="marketplace in marketplaces">{{marketplace}}</option>
						</select>
						<span class="text-danger h4" ng-show="noMarketplace">No Marketplace Selected.</span>
					</div>
				</div>
			</div>
			<div class="row" ng-show="listing.marketplace==='bstock'">
				<div class="row">
					<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error': noChargeType }">
						<label for="shippingChargeTypeInput">Shipping Charge Type</label>
						<select class="form-control" name="shippingChargeType" id="shippingChargeTypeInput" ng-model="listing.shipping.chargeType">
							<option ng-repeat="type in shippingChargeTypes" value="{{bstockFormConstants.shippingChargeType[type]}}">{{type}}</option>
						</select>
						<span class="text-danger h4" ng-show="noChargeType">No Charge Type Selected.</span>
					</div>
				</div>

				<div class="row" ng-show="listing.shipping.chargeType===bstockFormConstants.shippingChargeType['Fixed Cost']">
					<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error': invalidShippingCost }">
						<label for="fixedShippingCostInput">Cost</label>
						<input class="form-control" id="fixedShippingCostInput" ng-model="listing.shipping.cost">
						<span class="text-danger h4" ng-show="invalidShippingCost">Invalid Shipping Cost</span>
					</div>
					<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error': noCarrier }">
						<label for="shippingCarrierInput">Carrier</label>
						<input class="form-control" id="shippingCarrierInput" ng-model="listing.shipping.carrier">
						<span class="text-danger h4" ng-show="noCarrier">Carrier Input Required.</span>
					</div>
				</div>
				<div class="row" ng-show="[bstockFormConstants.shippingChargeType['Free Shipping'], bstockFormConstants.shippingChargeType['Fixed Cost']].includes(listing.shipping.chargeType)">
					<div class="form-group col-xs-12 col-sm-6">
						<label for="shippingAllowedDestinationsInput">Allowed Destinations</label>
						<select class="form-control" name="shippingAllowedDestinations" id="shippingAllowedDestinationsInput" ng-model="listing.shipping.allowedDestinations">
							<option ng-repeat="destinations in shippingAllowedDestinations" value="{{bstockFormConstants.shippingAllowedDestinations[destinations]}}">{{destinations}}</option>
						</select>
					</div>
				</div>
				<div class="row" ng-show="listing.shipping.chargeType===bstockFormConstants.shippingChargeType['Buyer Arranges Shipping']"></div>
			</div>
		</div>
		<div class="col-xs-12 row">
			<br/>
			<div class="pull-right">
				<button class="btn btn-danger" ng-click="backToLotDetails()">Back to Lot Details <span class="glyphicon glyphicon-pencil"></span></button>
				<button class="btn btn-success" ng-click="submitListing()">Submit Listing</button>
			</div>
		</div>
	</div>
	<div class="row" ng-show="waitingForResponse">
		<div class="center-block loader"></div>
		<h2 class="text-center">Please wait...</h2>
	</div>
</div>
