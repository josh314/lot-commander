workflow:
  rules:
    # Run MR pipeline when an MR exists
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    # Avoid duplicate branch pipeline for branches with open MRs
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never

    # Run normal branch pipelines
    - if: $CI_COMMIT_BRANCH

    # Run tag pipelines
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - build
  - push

variables:
  DOCKER_TLS_CERTDIR: "/certs"

lint-server:
  stage: lint
  image: node:24-slim
  before_script:
    - echo "@wazue:registry=https://${CI_SERVER_HOST}/api/v4/groups/${CI_PROJECT_NAMESPACE_ID}/-/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/groups/${CI_PROJECT_NAMESPACE_ID}/-/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm ci --prefer-offline
  script:
    - npm run lint-server

build:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    # Write .npmrc for GitLab package registry access using the CI job token
    - echo "@wazue:registry=https://${CI_SERVER_HOST}/api/v4/groups/${CI_PROJECT_NAMESPACE_ID}/-/packages/npm/" > /tmp/.npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/groups/${CI_PROJECT_NAMESPACE_ID}/-/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> /tmp/.npmrc
  script:
    - docker build --secret id=npmrc,src=/tmp/.npmrc -t "app:$CI_COMMIT_SHORT_SHA" .
    - docker save "app:$CI_COMMIT_SHORT_SHA" | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 3 hours

.push:
  stage: push
  image: docker:29
  services:
    - docker:29-dind
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    # apk aws-cli is broken on Alpine 3.20+ (libexpat symbol mismatch)
    # aws-cli v2 official binary requires glibc; Alpine uses musl — so it can't run either
    # Installing via pip uses Alpine's system Python (musl-compiled) and avoids both issues
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages --quiet awscli
    # Write the OIDC token to a file; AWS CLI uses it with AWS_ROLE_ARN to
    # automatically call sts:AssumeRoleWithWebIdentity — no explicit assume-role call needed
    - echo "$AWS_OIDC_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    # Authenticate Docker to ECR
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - docker load -i image.tar.gz
    # retag the generic build image with ECR destination tags
    - docker tag "app:$CI_COMMIT_SHORT_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - docker tag "app:$CI_COMMIT_SHORT_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
    # tag and push IMAGE_TAG if it was set from the environment
    - if [ -n "$IMAGE_TAG" ]; then docker tag "app:$CI_COMMIT_SHORT_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" && docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"; fi
    # tag and push the commit tag if this pipeline was triggered by a tag
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "app:$CI_COMMIT_SHORT_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_TAG" && docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_TAG"; fi

push-sandbox-autarch:
  extends: .push
  environment: sandbox-autarch
  needs:
    - build
  rules:
    - when: manual
      allow_failure: true

push-wazuezoom:
  extends: .push
  environment: wazuezoom
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /\d+\.\d+\.\d+$/
    - when: manual
      allow_failure: true
