<div class="container" ng-controller="PurchaseAggregationCtrl as $ctrl">
  <h2>Purchases</h2>

  <div class="row well" style="display: flex; flex-direction: column">

      <div style="display: flex; justify-content: space-around; align-items: center;">

        <div class="form-group">
          <label for="reportDateSearchInput">Start Date (start of day)</label>
          <input
            type="date"
            class="form-control"
            id="reportDateSearchInput"
            ng-model="$ctrl.aggregationStartDate"
            min="{{ $ctrl.aggregationMinDate }}"
            max="{{ $ctrl.aggregationMaxDate }}"
            ng-change="$ctrl.refreshPurchaseAggregation()"
          />
        </div>

        <div class="form-group">
          <label for="reportDateSearchInput">End Date (end of day)</label>
          <input
            type="date"
            class="form-control"
            id="reportDateSearchInput"
            ng-model="$ctrl.aggregationEndDate"
            min="{{ $ctrl.aggregationMinDate }}"
            max="{{ $ctrl.aggregationMaxDate }}"
            ng-change="$ctrl.refreshPurchaseAggregation()"
          />
        </div>

      </div>

      <ng-include src="'/partials/receiving/_pallet_aggregate_table.html'"></ng-include>

  </div>

</div>
