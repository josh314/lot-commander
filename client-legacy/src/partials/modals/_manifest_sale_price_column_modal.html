<div class="modal-header">
	<h3 class="modal-title">Create Sale Price Column</h3>
</div>
<div class="modal-body">
	<div class="row">
    <div class="form-group col-xs-12">
      <label for="discountPctInput">Discount percentage</label>
      <input class="form-control" type="number" id="discountPctInput" ng-model="$ctrl.discountPct">
    </div>
    <div class="form-group col-xs-12" ng-class="{ 'has-error' : $ctrl.cannotComputeSalePrices }" >
      <label for="priceTypeInput">Price type</label>
      <select class="form-control" id="priceTypeInput" ng-model="$ctrl.priceType" ng-change="$ctrl.checkIfCanComputeSalePrices()">
        <option ng-repeat="option in $ctrl.priceTypeOptions">{{ option }}</option>
      </select>
      <span class="text-danger h4" ng-show="$ctrl.cannotComputeSalePrices">Insufficient information to compute this type of sales price.</span>
    </div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$ctrl.createSalePriceColumn()" ng-disabled="!$ctrl.priceType || $ctrl.cannotComputeSalePrices">Continue</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
