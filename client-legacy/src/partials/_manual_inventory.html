<div class="container" ng-controller="ManualInventoryCtrl as ctrl">
	<h3>Manual Inventory</h3>

  <!-- UI: Submit new inventory -->
  <div class="row">
    <div ng-show="ctrl.showCreateInventoryControls">
      <fieldset class="col-xs-12 box-border">
        <legend class="box-border">Add Inventory Report</legend>

        <div style="display: flex; justify-content: space-between;">
          <span>
            <button class="btn btn-small btn-default" ng-click="ctrl.newInventory.addInventory()">Add Inventory Item</button>
          </span>
          <span>
            <button class="btn btn-small btn-warning" ng-show="ctrl.editingInventoryId" ng-click="ctrl.cancelEditManualInventory()" ng-disabled="!ctrl.editingInventoryId">Cancel Edit</button>
            <button class="btn btn-small btn-success" ng-click="ctrl.submitNewInventory()" ng-disabled="ctrl.newInventory.isInvalid()">Submit</button>
          </span>
        </div>

        <div ng-hide="ctrl.newInventory.isEmpty()">

          <table class="table table-striped">
            <thead><tr>
              <th>Type</th>
              <th>Quantity</th>
              <th></th>
            </tr></thead>
            <tbody>
              <tr ng-repeat="entry in ctrl.newInventory.data.inventory">
                <td><input ng-model="entry.name"></td>
                <td><input type="number" ng-model="entry.quantity"></td>
                <td><button class="btn btn-xs btn-danger" ng-click="ctrl.newInventory.removeInventory($index)">Remove</button>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="form-group">
            <label for="reportDateInput">Report Date</label>
            <input type="date" class="form-control" id="reportDateInput" ng-model="ctrl.newInventory.data.reportDate" max="{{ ctrl.newInventoryMaxReportDate }}"/>
          </div>

          <fieldset class="box-border">

            <legend class="box-border"><small>Groups</small></legend>
  
            <div class="form-group">
              <span ng-repeat="grp in ctrl.newInventory.data.groups" class="label label-info inventory-group-label">{{ grp }} <span class="glyphicon glyphicon-remove" ng-click="ctrl.removeGroup( grp )"></span></span>
            </div>
  
            <div class="form-group">
              <div class="input-group">
                <span class="input-group-btn">
                  <button ng-click="ctrl.addGroup()" class="btn btn-default" type="button">Add group</button>
                </span>
                <input class="form-control" ng-model="ctrl.groupToAdd" ng-keyup="$event.keyCode == 13 && ctrl.addGroup()">
              </div><!-- /input-group -->
            </div>
  
          </fieldset>

        </div>

      </fieldset>
    </div>
  </div>
  
  <!-- UI: Search manual inventory -->
  <div class="row">
    <div>
      <fieldset class="col-xs-12 box-border">
        <legend class="box-border">Search Inventory Reports</legend>

        <div style="display: flex;">

          <div class="form-group" style="margin-right: 12px;">
            <label for="startDateSearchInput">Start Date</label>
            <input type="date" class="form-control" id="startDateSearchInput" ng-model="ctrl.searchInputs.startDate" min="{{ ctrl.searchInputs.minDate }}"/>
          </div>

          <div class="form-group">
            <label for="endDateSearchInput">End Date</label>
            <input type="date" class="form-control" id="endDateSearchInput" ng-model="ctrl.searchInputs.endDate" min="{{ ctrl.searchInputs.minDate }}"/>
          </div>

        </div>

        <fieldset class="box-border">

          <legend class="box-border"><small>Groups</small></legend>

          <div class="form-group">
            <span ng-repeat="grp in ctrl.searchInputs.groups" class="label label-info inventory-group-label">{{ grp }} <span class="glyphicon glyphicon-remove" ng-click="ctrl.searchInputs.removeGroup( grp )"></span></span>
          </div>

          <div class="form-group">
            <div class="input-group">
              <span class="input-group-btn">
                <button ng-click="ctrl.searchInputs.addGroup()" class="btn btn-default" type="button">Add group to search</button>
              </span>
              <input class="form-control" ng-model="ctrl.searchInputs.groupToAdd" ng-keyup="$event.keyCode == 13 && ctrl.searchInputs.addGroup()">
            </div><!-- /input-group -->
          </div>

        </fieldset>

        <button class="btn btn-success" ng-click="ctrl.search()">Search</button>
      </fieldset>
    </div>
  </div>

  <div class="row well">
    <h4>Recent Inventory Levels</h4>
    <div  class="panel panel-primary" ng-repeat="inventory in ctrl.manualInventoryList">
      <div class="panel-heading">
        <div style="display:flex;justify-content:space-between;">
          <span>{{ inventory.reportDate.toLocaleString() }}</span>
          <span>User: {{ inventory.user.username }}</span>
        </div>
      </div>
      <div class="panel-body">


        <table class="table table-striped" ng-show="inventory.inventory.length > 0">
          <thead><tr>
            <th>Type</th>
            <th>Quantity</th>
            <th></th>
          </tr></thead>
          <tbody>	
            <tr ng-repeat="entry in inventory.inventory">
              <td>
                <span>{{ entry.name }}</span>
              </td>
              <td>
                <span>{{ entry.quantity }}</span>
              </td>
              <td>
              </td>
            </tr>
          </tbody>
        </table>

        <div ng-show="inventory.groups.length">
          <span ng-repeat="grp in inventory.groups" class="label label-info inventory-group-label">{{ grp }}</span>
        </div>

        <div ng-show="entry.notes">
          <p>{{ entry.notes }}</p>
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <div style="margin-left: 8px;">
            <button class="btn btn-sm btn-warning" ng-click="ctrl.startEditManualInventory( inventory )">Edit</button>
          </div>
          <div style="margin-left: 8px;">
            <button class="btn btn-sm btn-danger" ng-click="ctrl.deleteManualInventory( inventory )">Delete</button>
          </div>
        </div>

      </div>
    </div>
  </div>


</div>
