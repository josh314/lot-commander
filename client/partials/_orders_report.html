  <section class="row well" style="display: flex; justify-content: center; align-items: flex-end; flex-wrap:wrap">
    <div class="form-group" style="margin-right: 8px;">
      <label for="startDateInput">Start Date</label>
      <input type="date" class="form-control" id="startDateInput" ng-model="ctrl.inputs.startDate" min="{{ ctrl.inputs.minDate }}"/>
    </div>
    <div class="form-group" style="margin-right: 8px;">
      <label for="endDateInput">End Date</label>
      <input type="date" class="form-control" id="endDateInput" ng-model="ctrl.inputs.endDate" min="{{ ctrl.inputs.minDate }}"/>
    </div>
    <div class="form-group" style="margin-right: 8px;">
      <button class="btn btn-primary" ng-click="ctrl.loadOrdersForInputDateRange()">Load Orders</button>
    </div>
  </section>
  <section class="row well" ng-show="!ctrl.waitingToLoadOrders && ctrl.orderList.startDate && ctrl.orderList.endDate">
    <!-- <h4>Data loaded for interval:</h4> -->
    <!-- <div class="form-group col-xs-12 col-sm-6">

    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="endDateInput">End Date</label>

    </div> -->
    <!-- <button class="btn btn-primary" ng-click="ctrl.loadGraph()">Load graph</button> -->

    <div class="row col-xs-12 col-sm-6">
      <div class="form-group col-xs-12">
        <label for="tagFilterInput">Tag Filter</label>
        <select class="form-control" id="tagFilterInput" ng-model="ctrl.inputs.tagFilter" ng-options="tag for tag in ctrl.inputs.tagFilterOptions" ng-change="ctrl.loadGraph()">
        </select>
      </div>
    </div>
    <div class="row col-xs-12 col-sm-6">
      <div class="form-group col-xs-12">
        <label for="timeUnitsInput">Time Units</label>
        <select class="form-control" id="timeUnitsInput" ng-model="ctrl.inputs.timeUnits" ng-options="opt.displayName for opt in ctrl.inputs.timeUnitsOptions" ng-change="ctrl.loadGraph()">
        </select>
      </div>
    </div>
    <figure class="chart-container"></figure>
  </section>
  <div class="row" ng-show="ctrl.waitingToLoadOrders">
		<div class="center-block loader"></div>
    <h2 class="text-center">Please wait...</h2>
    <h3 class="text-center">This may take up to a few minutes</h3>
  </div>
</main>
