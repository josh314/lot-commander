<div class="container">
	<h3>Scan Manifest Items</h3>
	<div class="row well">
		<div class="col-xs-12">
		    <form name="scanForm">
				<div class="row">
					<div class="form-group" ng-class="{ 'has-error' : (scanForm.barcode.$invalid && !scanForm.barcode.$pristine) || barcodeNotFound || networkError}">
						<label for="barcodeInput">Scan Barcode here</label>
						<input type="text" class="form-control" name="barcode" id="barcodeInput" ng-model="scannedBarcode" ng-keyup="$event.keyCode == 13 && scanBarcode()" autocomplete="off" ng-pattern="'[0-9]{8,15}'" autofocus>
						<span class="text-danger h4" ng-show="scanForm.barcode.$invalid && !scanForm.barcode.$pristine">Invalid Barcode Format</span>
					</div>
				</div>
			</form>
		</div>
	</div>
	
	<div class="row">
		<div class="well">

				<ul class="pull-left list-inline">
					<li><span class="">Handle</span><span>{{ lot.getHandle() }}</span></li>

			<div class="col-xs-12 row" style="margin-bottom: 40px">
				<div class="col-xs-3 row">
					<div class="col-xs-12 text-center">
						<h3>Handle</h3>
					</div>
					<div class="col-xs-12 text-center">
						<h4 class="text-danger">{{ lot.getHandle() }}</h4>
					</div>
				</div>
				<div class="col-xs-3 row">
					<div class="col-xs-12 text-center">
						<h3>SKU Count</h3>
					</div>
					<div class="col-xs-12 text-center">
						<h4 class="text-danger">{{ lot.getNumSku() }}</h4>
					</div>
				</div>
				<div class="col-xs-3 row">
					<div class="col-xs-12 text-center">
						<h3>Inventory Count</h3>
					</div>
					<div class="col-xs-12 text-center" style="background: lightgray; border-radius: 50px; border: solid 1px grey;">
						<h4 class="text-danger">{{ lot.getInventoryTotal() }}</h4>
					</div>
				</div>
				<div class="col-xs-3 row pull-right">
            <a class="btn btn-primary" ng-click="editShippingItems()">Edit Shipping Items</a>
            <a class="btn btn-success" ng-click="saveManifest()">Done</a>
				</div>
			</div>
			<table class="table table-striped">
				<thead><tr>
					<th>Image</th>
					<th>Barcode</th>
					<th>Title</th>
					<th>Quantity</th>
					<th>Price</th>
					<th>Remove</th>
				</tr></thead>
				<tbody>
					<tr ng-repeat="item in lot.getInventory()">
						<td>
							<!-- <img class="inventory-preview-img" ng-src="{{item.images[0]}}"> -->
							<!-- <div id="item-thumbnail-container-{{item.barcode}}"></div> -->
							<img ng-src="{{loadedImages[item.barcode].src}}" class="inventory-preview-img">
						</td>
						<td><input type="text" size=16 ng-model="item.barcode"></td>
						<td><input type="text" size="64" ng-model="item.description"></td>
						<td>
							<input type="number" class="hide-controls" style="width: 4em" ng-model="item.quantity" min="0">
							<button class="btn btn-success btn-xs" ng-click=" item.quantity = item.quantity + 1 "><span class="glyphicon glyphicon-plus"></span></button>
							<button class="btn btn-warning btn-xs" ng-click=" item.quantity = item.quantity>0 ? item.quantity - 1 : 0" ng-disabled="item.quantity<=0"><span class="glyphicon glyphicon-minus"></span></button>
						</td>
						<td><input type="text" size="6" ng-model="item.price"></td>
						<td><button class="btn btn-danger btn-xs" ng-click="deleteProduct(item.barcode)"><span class="glyphicon glyphicon-remove"></span></button></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="col-xs-6"><a class="btn btn-success btn-lg" ng-click="saveManifest()">Done</a></div>
	</div>	
</div>
