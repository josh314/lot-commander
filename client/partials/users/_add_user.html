<div class="container">

	<div class="col-sm-6 col-sm-offset-3">

	    <h1><span class="fa fa-sign-in"></span> Create new user</h1>

	    <form action="/api/users/new" method="post">
	        <div class="form-group">
	            <label>Name</label>
	            <input type="text" class="form-control" name="name" autofocus required>
	        </div>
	        <div class="form-group">
	            <label>Role</label>
	            <select class="form-control" ng-model="newUserRole" name="role">
		            <option ng-repeat="role in userRoles">{{role}}</option>
	            </select>
	        </div>
	        <div class="form-group">
	            <label>Username</label>
	            <input type="text" class="form-control" name="username" required>
	        </div>
	        <div class="form-group">
	            <label>Password</label>
	            <input type="password" class="form-control" name="password" required pattern=".{8,32}">
	        </div>

	        <button type="submit" class="btn btn-warning btn-lg">Add User</button>
	    </form>
	</div>

</div>
