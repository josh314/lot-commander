	<h1>Create A New Lot</h1>

	<div class="row well">
		<!-- <h2 class="col-xs-12">Custom Lot</h2> -->
		<div class="col-xs-12">
			<div class="form-group">
				<label for="catInput">Category</label>
				<select class="form-control" id="catInput" ng-model="newLotCategory" ng-change="setHandleForCategory()">
					<option ng-repeat="cat in categories">{{cat}}</option>
				</select>
			</div>
			<div class="form-group" ng-class="{ 'has-error' : noHandleSubmitted }">
				<label for="handleInput">Handle (required)</label>
				<input type="text" class="form-control" name="handle" id="handleInput" ng-model="newLot.handle" autocomplete="off" autofocus>
				<span class="text-danger h4" ng-show="noHandleSubmitted">No Handle submitted.</span>
			</div>
			<div class="form-group" ng-class="{ 'has-error' : noMarketplaceSubmitted }">
				<label for="destinationMarketplaceInput">Marketplace (required)</label>
				<select class="form-control" name="destinationMarketplace" id="destinationMarketplaceInput" ng-model="newLot.destinationMarketplace">
					<option ng-repeat="marketplace in marketplaces">{{marketplace}}</option>
        </select>
        <span class="text-danger h4" ng-show="noMarketplaceSubmitted">No Marketplace selected.</span>
			</div>
			<div class="form-group" ng-class="{ 'has-error' : noLotTypeSubmitted }">
				<label for="typeInput">Lot Type (required)</label>
				<select class="form-control" name="type" id="typeInput" ng-model="newLot.type">
					<option ng-repeat="type in lotTypes">{{type}}</option>
        </select>
        <span class="text-danger h4" ng-show="noLotTypeSubmitted">No Lot Type selected.</span>
      </div>
      <div class="form-group" ng-class="{ 'has-error' : noPackagingTypeSubmitted }">
				<label for="packagingTypeInput">Packaging Type (required)</label>
				<select class="form-control" name="packagingType" id="packagingTypeInput" ng-model="newLot.packagingType">
					<option ng-repeat="packagingType in packagingTypes">{{packagingType}}</option>
        </select>
        <span class="text-danger h4" ng-show="noPackagingTypeSubmitted">No Packaging Type selected.</span>
			</div>
			<div class="form-group">
				<label for="manifestedInput">Manifested Lot?</label>
				<select class="form-control" name="manifested" id="manifestedInput" ng-model="newLot.unmanifested">
					<option ng-value="false">Yes</option>
					<option ng-value="true">No</option>
				</select>
      </div>
      <div class="form-group" ng-hide="newLot.unmanifested">
				<label for="willUploadManifestInput">Are you uploading a manifest file?</label>
				<select class="form-control" name="willUploadManifest" id="willUploadManifestInput" ng-model="willUploadManifest">
					<option ng-value="false">No</option>
					<option ng-value="true">Yes</option>
				</select>
			</div>
			<div class="form-group">
				<label for="descInput">Description (optional)</label>
				<input type="text" class="form-control" name="desc" id="descInput" ng-model="newLot.description" autocomplete="off">
			</div>
            <div>
				<input class="btn btn-success" type="submit" ng-click="startCustomLot()" value="Create">
			</div>
		</div>
	</div>
</div>
