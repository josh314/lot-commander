<div class="container manifest-cleaner" ng-controller="CleanManifestCtrl as cleaner">
	<div class="row well">
    <div class="col-xs-6 row">
      <div class="form-group col-xs-12" ng-class="{ 'has-error' : cleaner.noFileSelected }">
        <label for="fileInput">Manifest File</label>
        <input type="file" class="form-control" id="fileInput" required file-model="cleaner.manifestFile">
        <span class="text-danger h4" ng-show="cleaner.noFileSelected">Please select a file.</span>
      </div>
      <div class="form-group col-xs-12">
        <div class="checkbox">
          <label for="noHeaderRowInput">
            <input type="checkbox" id="noHeaderRowInput" ng-model="cleaner.noHeaderRow">
            This manifest has no header row
          </label>
        </div>
      </div>
      <div class="form-group col-xs-12">
        <label for="skipFirstRowsInput">Skip first rows</label>
        <input type="number" id="skipFirstRowsInput" ng-model="cleaner.skipFirstRows">
      </div>
    </div>
    <div class="col-xs-12">
      <button class="btn btn-primary" type="button" ng-click="cleaner.loadManifest()">Load Manifest</button>
    </div>
  </div>
  <div class="row" ng-show="cleaner.manifest">
    <div class="well col-xs-12">
      <h2>Sheet Controls</h2>
      <div class="row col-xs-12 col-sm-6">
        <div class="form-group col-xs-12">
          <label for="selectSheetInput">Select Sheet</label>
          <select class="form-control" id="selectSheetInput" ng-model="cleaner.manifest.activeSheet" ng-options="sheet.name for sheet in cleaner.manifest.sheets">
          </select>
        </div>
      </div>
      <div class="col-xs-12 col-sm-6">
        <p class="text-center">
          <button class="btn btn-danger" ng-click="cleaner.deleteSheet(cleaner.getActiveSheet())" ng-disabled="!cleaner.getActiveSheet()">Delete this sheet</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="cleaner.addCheckDigitsAllSheets()">Add Check Digits For All Sheets</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="cleaner.launchManifestFileOptionsModal()">Download Manifest File</button>
        </p>
      </div>
    </div>
    <div class="manifest-table-container col-xs-12 well" ng-repeat="sheet in cleaner.manifest.sheets" ng-show="cleaner.getActiveSheet() == sheet" >
      <table class="table table-striped table-bordered">
        <thead>
          <th ng-repeat="column in sheet.columns">
            <div class="text-center" style="margin-bottom: 3px;" ng-show="column.isBarcodeColumn()">
              <button class="btn btn-xs btn-primary" ng-click="cleaner.getActiveSheet().addCheckDigits()">Add check digits</button>
            </div>
            <div class="text-center" style="margin-bottom: 3px;" ng-show="column.isStandardColumn()">
              <button class="btn btn-xs btn-primary" ng-click="cleaner.manifest.setStandardColumnAllSheets(column.name, column.displayName)">Use for all sheets</button>
            </div>
            <select ng-model="column.displayName" ng-change="sheet.updateColumnTitleOptions()">
              <option >{{ column.name }}</option>
              <option ng-repeat="opt in column.nameOptions">{{ opt }}</option>
            </select>
          </th>
        </thead>
        <tbody>
          <tr ng-repeat="row in sheet.rows | limitTo: 50 track by row.idx">
            <td ng-repeat="column in sheet.columns" ng-if="column.name!=='idx'" ng-class="sheet.getCellClass(row, column)" ng-click="column.toggleSelect()">{{ row[column.name] }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
