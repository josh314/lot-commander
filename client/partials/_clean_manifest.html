<div class="container manifest-cleaner" ng-controller="CleanManifestCtrl as $ctrl">
	<div class="row well">
    <div class="col-xs-6 row">
      <div class="form-group col-xs-12" ng-class="{ 'has-error' : $ctrl.noFileSelected }">
        <label for="fileInput">Manifest File</label>
        <input type="file" class="form-control" id="fileInput" required file-model="$ctrl.manifestFile">
        <span class="text-danger h4" ng-show="$ctrl.noFileSelected">Please select a file.</span>
      </div>
      <div class="form-group col-xs-12">
        <div class="checkbox">
          <label for="noHeaderRowInput">
            <input type="checkbox" id="noHeaderRowInput" ng-model="$ctrl.noHeaderRow">
            This manifest has no header row
          </label>
        </div>
      </div>
      <div class="form-group col-xs-12">
        <label for="skipFirstRowsInput">Skip first rows</label>
        <input type="number" id="skipFirstRowsInput" ng-model="$ctrl.skipFirstRows">
      </div>
    </div>
    <div class="col-xs-12">
      <button class="btn btn-primary" type="button" ng-click="$ctrl.loadManifestFromSelectedFile()">Load Manifest</button>
    </div>
  </div>
  <div class="row" ng-show="$ctrl.manifest">
    <div class="well col-xs-12">
      <h2>Sheet Controls</h2>
      <div class="row col-xs-12 col-sm-6">
        <div class="form-group col-xs-12">
          <label for="selectSheetInput">Select Sheet</label>
          <select class="form-control" id="selectSheetInput" ng-model="$ctrl.manifest.activeSheet" ng-options="sheet.name for sheet in $ctrl.manifest.sheets">
          </select>
        </div>
      </div>
      <div class="col-xs-12 col-sm-6">
        <p class="text-center">
          <button class="btn btn-danger" ng-click="$ctrl.deleteSheet($ctrl.getActiveSheet())" ng-disabled="!$ctrl.getActiveSheet()">Delete this sheet</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="$ctrl.addCheckDigitsAllSheets()">Add Check Digits For All Sheets</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="$ctrl.startManifestDownload()">Download Manifest File</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="$ctrl.saveToShipment()" ng-show="$ctrl.shipmentId">Save to shipment</button>
        </p>
        <p class="text-center">
          <button class="btn btn-primary" ng-click="$ctrl.createSalePriceColumn()">Create Sale Price Column</button>
        </p>
      </div>
    </div>
    <div class="manifest-table-container col-xs-12 well" ng-repeat="sheet in $ctrl.manifest.sheets" ng-show="$ctrl.getActiveSheet() == sheet" >
      <table class="table table-striped table-bordered">
        <thead>
          <th>#</th>
          <th ng-repeat="column in sheet.columns">
            <div class="text-center" style="margin-bottom: 3px;" ng-show="column.isBarcodeColumn()">
              <button class="btn btn-xs btn-primary" ng-click="$ctrl.getActiveSheet().addCheckDigits()">Add check digits</button>
            </div>
            <div class="text-center" style="margin-bottom: 3px;" ng-show="column.isBarcodeColumn()">
              <button class="btn btn-xs btn-primary" ng-click="$ctrl.getActiveSheet().prependUpcZeros()">Prepend zeros</button>
            </div>
            <div class="text-center" style="margin-bottom: 3px;" ng-show="column.isStandardColumn()">
              <button class="btn btn-xs btn-primary" ng-click="$ctrl.manifest.setStandardColumnAllSheets(column.name, column.displayName)">Use for all sheets</button>
            </div>
            <div class="text-center" style="margin-bottom: 3px;">
              <button class="btn btn-xs btn-primary" ng-click="column.toggleSelect()">
                <span ng-hide="column.isSelected()">Select column</span>
                <span ng-show="column.isSelected()">Deselect column</span>
              </button>
            </div>
            <div class="text-center" style="margin-bottom: 3px;">
              <button class="btn btn-xs btn-primary" ng-click="$ctrl.splitActiveSheetByColumn( column.name )">Split &amp; group by</button>
            </div>
            <select ng-model="column.displayName" ng-change="sheet.updateColumnDisplayName( column )">
              <option >{{ column.name }}</option>
              <option ng-repeat="opt in column.nameOptions">{{ opt }}</option>
            </select>
          </th>
        </thead>
        <tbody>

          <tr ng-repeat="row in sheet.rows.slice( 0, sheet.displayAllRows ? sheet.rows.length : 50 ) track by row.idx">

            <td>{{ row.idx }}</td>

            <td
              ng-repeat="column in sheet.columns"
              ng-class="sheet.getCellClass( row, column )"
              ng-dblclick="sheet.startCellEdit( row, column )"
            >
              <div ng-hide="sheet.isEditing( row, column )">
                <p>{{ row[column.name] }}</p>
                <p style="font-size: 10px;" ng-show="column.isBarcodeColumn()">
                  <span class="glyphicon glyphicon-remove" ng-hide="sheet.cellUpcCheckDigitValid( row, column )"></span>
                  <span class="glyphicon glyphicon-ok" ng-show="sheet.cellUpcCheckDigitValid( row, column )"></span>
                  Check digit
                </p>
                <p style="font-size: 10px;" ng-show="column.isBarcodeColumn()">
                  <span class="glyphicon glyphicon-remove" ng-hide="sheet.cellUpcLengthValid( row, column )"></span>
                  <span class="glyphicon glyphicon-ok" ng-show="sheet.cellUpcLengthValid( row, column )"></span>
                  UPC-12 length
                </p>
              </div>
              <div ng-show="sheet.isEditing( row, column )">
                <input ng-model="row[column.name]" ng-keyup="$event.keyCode == 13 && sheet.endCellEdit( row, column )"/>
              </div>
            </td>
            
          </tr>

        </tbody>
      </table>

      <a ng-show="(sheet.rows.length > 50) && !sheet.displayAllRows" ng-click="sheet.displayAllRows=true">Show all rows...</a>
    </div>
  </div>
</div>
