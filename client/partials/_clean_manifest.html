<div class="container" ng-controller="CleanManifestCtrl as cleaner">	
	<div class="row well">
    <div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : cleaner.noFileSelected }">
      <label for="fileInput">Manifest File</label>
      <input type="file" class="form-control" id="fileInput" required file-model="cleaner.manifestFile">
      <span class="text-danger h4" ng-show="cleaner.noFileSelected">Please select a file.</span>
    </div>
    <div class="col-xs-12">
      <button class="btn btn-primary" type="button" ng-click="cleaner.loadManifest()">Load Manifest</button>
    </div>
  </div>
  <div class="row" ng-show="cleaner.manifest">
    <div class="row form-inline pull-right">
      <div class="form-group">
        <label for="barcodeColumnInput">Barcode column</label>
        <select class="form-control" id="barcodeColumnInput" ng-model="cleaner.getActiveSheet().barcodeColumnName" ng-change="cleaner.getActiveSheet().setBarcodeColumn()">
          <option></option>
          <option ng-repeat="column in cleaner.getActiveSheet().columns">{{ column.name }}</option>
        </select>
        <div class="checkbox">
          <label for="barcodeColumnAllSheetsInput">
            <input type="checkbox" id="barcodeColumnAllSheetsInput" ng-model="cleaner.manifest.barcodeColumnAllSheets" ng-change="cleaner.setBarcodeColumnAllSheets()">
            Use for all sheets
          </label>
        </div>
      </div>
    </div>
    <div class="row">
      <ul class="nav nav-tabs">
        <li ng-repeat="sheet in cleaner.manifest.sheets" ng-class="{ 'active': cleaner.getActiveSheet() == sheet }">
          <a href ng-click="cleaner.setActiveSheet(sheet.name)">{{ sheet.name }}</a>
        </li>
      </ul>
    </div>
    <div class="row" ng-repeat="sheet in cleaner.manifest.sheets" ng-show="cleaner.getActiveSheet() == sheet" >
      <!-- <div class="row form-inline">
        <div class="form-group">
          <label for="barcodeColumnInput">Barcode column</label>
          <select class="form-control" id="barcodeColumnInput" ng-model="sheet.barcodeColumn">
            <option ng-repeat="column in sheet.columns">{{ column.name }}</option>
          </select>
        </div>
      </div> -->
      <div class="row">
        <table class="table table-striped table-bordered">
          <thead>
            <th ng-repeat="column in sheet.columns" ng-click="column.toggleSelect()">{{ column.name }}</th>
          </thead>
          <tbody>
            <tr ng-repeat="row in sheet.rows">
              <td ng-repeat="column in sheet.columns" ng-class="{ 'danger': column.isBarcodeColumn, 'warning': column.selected && !column.isBarcodeColumn }">{{ row[column.name] }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
