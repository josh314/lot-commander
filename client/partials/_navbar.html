<header class="navbar navbar-default navbar-fixed-top" ng-controller="NavbarCtrl as ctrl">
  <div class="navbar-inner">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" ng-click="ctrl.toggleCollapse()">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand navbar-left" ui-sref="{{ctrl.navbar.brand.state}}" ng-click="ctrl.collapse()">{{ctrl.navbar.brand.title}}</a>
      </div>
      <!-- Non-collapsed header for most sizes -->
      <nav class="hidden-xs">
        <ul class="nav navbar-nav navbar-right">
          <li ng-repeat="item in ctrl.navbar.navItems" uib-dropdown>
            <a ng-if="item.drops" href class="dropdown-toggle" uib-dropdown-toggle>{{item.title}}<b class="caret"></b></a>
            <ul ng-if="item.drops" class="dropdown-menu">
              <li ng-repeat="dropItem in item.drops"><a ui-sref="{{dropItem.state}}">{{dropItem.title}}</a></li>
            </ul>
            <a ng-if="!item.drops" href ui-sref="{{item.state}}">{{item.title}}</a>
          </li>
        </ul>
      </nav>
      <!-- Collapsing header with stacked navs for XS size-->
      <nav uib-collapse="ctrl.isCollapsed" style="height: 0px;" class="hidden-sm hidden-md hidden-lg">
        <ul class="nav navbar-nav">
          <li ng-repeat="item in ctrl.navbar.navItems" uib-dropdown>
            <a ng-if="item.drops" href class="dropdown-toggle" uib-dropdown-toggle>{{item.title}}<b class="caret"></b></a>
            <ul ng-if="item.drops" class="dropdown-menu">
              <li ng-repeat="dropItem in item.drops"><a ui-sref="{{dropItem.state}}" ng-click="ctrl.collapse()">{{dropItem.title}}</a></li>
            </ul>
            <a ng-if="!item.drops" ui-sref="{{item.state}}" ng-click="ctrl.collapse()">{{item.title}}</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
