<div class="container" ng-controller="EditManifestCtrl as $ctrl">
	<div class="row">
		<div class="well">
			<h3>Edit Manifest</h3>
			<!-- <div class="col-xs-2 pull-right"><a class="btn btn-success btn-lg" ng-click="$ctrl.saveManifest()">Save</a></div> -->
      <div class="col-xs-3 row pull-right" style="display:flex; flex-direction:column;">
        <div>
          <a class="btn btn-success" ng-click="$ctrl.saveManifest()" ng-disabled="!$ctrl.validateInventory()">Save</a>
          <a class="btn btn-success" ng-click="$ctrl.saveManifestAndExit()" ng-disabled="!$ctrl.validateInventory()">Save & finish</a>
        </div>
      </div>
			<table class="table table-striped">
				<thead><tr>
					<th>Barcode</th>
          <th ng-show="$ctrl.showAsin">ASIN</th>
					<th>Title</th>
					<th>Quantity</th>
					<th>Price</th>
					<th>Delete</th>
				</tr></thead>
				<tbody>
					<tr ng-repeat="$item in $ctrl.lot.getInventorySortedByBarcode()">
						<td>
              <div style="display:flex; flex-direction:column;">
                <input type="text" size=14 ng-model="$item.data.barcode" ng-change="$ctrl.editProductData( $item )">
                <span ng-show="$item.errors.duplicateBarcode" class="text-danger" role="alert">
                  <strong>Duplicate barcode!</strong>
                </span>
              </div>
            </td>
            <td ng-show="$ctrl.showAsin"><input type="text" size="12" ng-model="$item.data.asin" ng-change="$ctrl.editProductData( $item )"></td>
            <td><input type="text" size="64" ng-model="$item.data.title" ng-change="$ctrl.editProductData( $item )"></td>
						<td><input type="number" style="width: 4em" ng-model="$item.data.quantity" min="0"></td>
            <td>
              <div class="form-group" ng-class="{ 'has-error' : $item.errors.price }">
                <input type="text" class="form-control" name="price" ng-model="$item.data.price" size="6" ng-change="$ctrl.editProductData( $item )">
              </div>
            </td>
						<td><button class="btn btn-danger btn-xs" ng-click="$ctrl.deleteInventoryItem( $item )"><span class="glyphicon glyphicon-remove"></span></button></td>
					</tr>
					<tr>
						<td><a class="btn btn-primary btn-xs" ng-click="$ctrl.addInventoryItem()">Add New Item</a></td>
						<td></td>
						<td></td>
						<td></td>
						<td></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="col-xs-6"><a class="btn btn-success btn-lg" ng-click="$ctrl.saveManifestAndExit()" ng-disabled="!$ctrl.validateInventory()">Save & finish</a></div>
	</div>
</div>
