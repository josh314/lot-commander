<div class="container" ng-controller="EditManifestCtrl as $ctrl">
	<div class="row">
		<div class="well">
			<h3>Edit Manifest</h3>
			<!-- <div class="col-xs-2 pull-right"><a class="btn btn-success btn-lg" ng-click="$ctrl.saveManifest()">Save</a></div> -->
      <div class="col-xs-3 row pull-right" style="display:flex; flex-direction:column;">
        <div>
          <a class="btn btn-success" ng-click="$ctrl.saveManifest()" ng-disabled="!$ctrl.validateInventory()">Save</a>
          <a class="btn btn-success" ng-click="$ctrl.saveManifestAndExit()" ng-disabled="!$ctrl.validateInventory()">Save & finish</a>
        </div>
      </div>
			<table class="table table-striped">
				<thead><tr>
					<th>Barcode</th>
          <th ng-click="$ctrl.showAsin = !$ctrl.showAsin">
            <span ng-show="$ctrl.showAsin">ASIN <small><span class="glyphicon glyphicon-triangle-bottom"></span></small></span>
            <span ng-hide="$ctrl.showAsin"><small><span class="glyphicon glyphicon-triangle-right"></span></small></span>
          </th>
          <th ng-click="$ctrl.showTitle = !$ctrl.showTitle">
            <span ng-show="$ctrl.showTitle">Title <small><span class="glyphicon glyphicon-triangle-bottom"></span></small></span>
            <span ng-hide="$ctrl.showTitle"><small><span class="glyphicon glyphicon-triangle-right"></span></small></span>
          </th>
          <th ng-click="$ctrl.showBrand = !$ctrl.showBrand">
            <span ng-show="$ctrl.showBrand">Brand <small><span class="glyphicon glyphicon-triangle-bottom"></span></small></span>
            <span ng-hide="$ctrl.showBrand"><small><span class="glyphicon glyphicon-triangle-right"></span></small></span>
          </th>
          <th ng-click="$ctrl.showQuantity = !$ctrl.showQuantity">
            <span ng-show="$ctrl.showQuantity">Quantity <small><span class="glyphicon glyphicon-triangle-bottom"></span></small></span>
            <span ng-hide="$ctrl.showQuantity"><small><span class="glyphicon glyphicon-triangle-right"></span></small></span>
          </th>
          <th ng-click="$ctrl.showPrice = !$ctrl.showPrice">
            <span ng-show="$ctrl.showPrice">Price <small><span class="glyphicon glyphicon-triangle-bottom"></span></small></span>
            <span ng-hide="$ctrl.showPrice"><small><span class="glyphicon glyphicon-triangle-right"></span></small></span>
          </th>
					<th>Delete</th>
				</tr></thead>
				<tbody>
					<tr ng-repeat="$item in $ctrl.lot.getInventorySortedByBarcode()">
						<td>
              <div style="display:flex; flex-direction:column;">
                <input class="form-control" type="text" size="12" ng-model="$item.data.barcode" ng-change="$ctrl.editProductData( $item )">
                <span ng-show="$item.errors.duplicateBarcode" class="text-danger" role="alert">
                  <strong>Duplicate barcode!</strong>
                </span>
              </div>
            </td>
            <td>
              <span ng-show="$ctrl.showAsin">
                <input class="form-control" type="text" size="12" ng-model="$item.data.asin" ng-change="$ctrl.editProductData( $item )" ng-disabled="$item.barcodeIsAsin">
              </span>
            </td>
						<td>
              <span ng-show="$ctrl.showTitle">
                <textarea
                  class="form-control"
                  cols="54"
                  rows="{{ $item.titleIsFocused ? 4 : 1 }}"
                  ng-model="$item.data.title"
                  ng-change="$ctrl.editProductData( $item )"
                  ng-focus="$item.titleIsFocused = true"
                  ng-blur="$item.titleIsFocused = false"
                ></textarea>
              </span>
            </td>
            <td>
              <span ng-show="$ctrl.showBrand">
                <textarea
                  class="form-control"
                  cols="{{ $item.brandIsFocused ? 16 : 10 }}"
                  rows="{{ $item.brandIsFocused ? 3 : 1 }}"
                  ng-model="$item.data.brand"
                  ng-change="$ctrl.editProductData( $item )"
                  ng-focus="$item.brandIsFocused = true"
                  ng-blur="$item.brandIsFocused = false"
                ></textarea>
              </span>
            </td>
						<td>
              <span ng-show="$ctrl.showQuantity" ng-class="{ 'has-error' : $item.errors.quantity }">
                <input class="form-control" type="text" inputmode="numeric" size="5" ng-model="$item.data.quantity" ng-change="$ctrl.editProductData( $item )" min="0">
              </span>
            </td>
            <td>
              <span ng-show="$ctrl.showPrice" ng-class="{ 'has-error' : $item.errors.price }">
                <input type="text" class="form-control" name="price" ng-model="$item.data.price" size="6" ng-change="$ctrl.editProductData( $item )">
              </span>
            </td>
						<td><button class="btn btn-danger btn-xs" ng-click="$ctrl.deleteInventoryItem( $item )"><span class="glyphicon glyphicon-remove"></span></button></td>
					</tr>
					<tr>
						<td><a class="btn btn-primary btn-xs" ng-click="$ctrl.addInventoryItem()">Add New Item</a></td>
						<td></td>
						<td></td>
						<td></td>
						<td></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="col-xs-6"><a class="btn btn-success btn-lg" ng-click="$ctrl.saveManifestAndExit()" ng-disabled="!$ctrl.validateInventory()">Save & finish</a></div>
	</div>
</div>
