<div class="container" ng-controller="ReceivedPalletCreationCtrl as $ctrl">

  <h2>New Received Pallet</h2>

  <div class="row well">

    <div class="col-xs-12">
      <div class="form-group col-xs-12 col-sm-4" ng-class="{ 'has-error' : $ctrl.validator.invalidHandle }">
        <label for="handleInput">Pallet ID</label>
        <input type="text" class="form-control" id="handleInput" ng-model="$ctrl.inputs.handle" autocomplete="off" ng-change="$ctrl.inputs.handle && $ctrl.refreshValidator()">
        <span class="text-danger h4" ng-show="$ctrl.validator.invalidHandle">No pallet ID submitted.</span>
      </div>
      <div class="form-group col-xs-12 col-sm-4" ng-class="{ 'has-error' : $ctrl.validator.invalidCategory }">
        <label for="categoryInput">Category</label>
        <select class="form-control" id="categoryInput" ng-model="$ctrl.inputs.category">
          <option ng-repeat="cat in $ctrl.inputs.categoryOptions">{{cat}}</option>
        </select>
        <span class="text-danger h4" ng-show="$ctrl.validator.invalidCategory">No category submitted.</span>
      </div>
      <div class="form-group col-xs-12 col-sm-4" ng-class="{ 'has-error' : $ctrl.validator.invalidUnits }">
        <label for="unitsInput">Units</label>
        <input type="number" class="form-control" id="unitsInput" ng-model="$ctrl.inputs.units" autocomplete="off" ng-change="$ctrl.inputs.units && $ctrl.refreshValidator()">
        <span class="text-danger h4" ng-show="$ctrl.validator.invalidUnits">Invalid units submitted.</span>
      </div>
      <div class="form-group col-xs-12" ng-class="{ 'has-error' : $ctrl.validator.invalidNote }">
        <label for="noteInput">Note</label>
        <input type="textarea" class="form-control" id="noteInput" ng-model="$ctrl.inputs.note" autocomplete="off" ng-change="$ctrl.inputs.note && $ctrl.refreshValidator()">
        <span class="text-danger h4" ng-show="$ctrl.validator.invalidNote">Invalid note submitted.</span>
      </div>
    </div>

    <button class="btn btn-success" ng-click="$ctrl.createReceivedPallets()">Create</button>
    <span class="text-danger h4" ng-hide="$ctrl.validator.isValid()">Check for input errors.</span>

</div>
