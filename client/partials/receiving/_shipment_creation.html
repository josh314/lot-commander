<div class="container" ng-controller="ShipmentCreationCtrl as ctrl">

  <h2>New Incoming Shipment</h2>

  <div class="row well">
    <div class="col-xs-12 col-sm-6">
      <div class="form-group" ng-class="{ 'has-error' : ctrl.errors.noHandle }">
        <label for="handleInput">Handle</label>
        <input type="text" class="form-control" id="handleInput" ng-model="ctrl.inputs.handle" autocomplete="off">
        <span class="text-danger h4" ng-show="ctrl.errors.noHandle">No handle submitted.</span>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6">
      <div class="form-group" ng-class="{ 'has-error' : ctrl.errors.noCategory }">
        <label for="categoryInput">Category</label>
        <select class="form-control" id="categoryInput" ng-model="ctrl.inputs.category">
          <option ng-repeat="cat in ctrl.inputs.categoryOptions">{{cat}}</option>
        </select>
        <span class="text-danger h4" ng-show="ctrl.errors.noCategory">No category submitted.</span>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6">
      <div class="form-group" ng-class="{ 'has-error' : ctrl.errors.noVendor }">
        <label for="vendorInput">Vendor</label>
        <input type="text" class="form-control" id="vendorInput" ng-model="ctrl.inputs.vendor" autocomplete="off">
        <span class="text-danger h4" ng-show="ctrl.errors.noVendor">No vendor submitted.</span>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6">
      <div class="form-group">
        <label for="carrierInput">Carrier</label>
        <input type="text" class="form-control" id="carrierInput" ng-model="ctrl.inputs.carrier" autocomplete="off">
      </div>
    </div>
    <div class="col-xs-12 col-sm-6">
      <div class="form-group">
        <label for="arrivalDateInput">Arrival Date</label>
        <input type="date" class="form-control" id="arrivalDateInput" ng-model="ctrl.inputs.arrivalDate"/>
      </div>
    </div>
  </div>
  <div class="row well">
    <table class="table table-striped">
      <thead><tr>
        <th>Handle</th>
        <th>Units</th>
        <th>Category</th>
        <th>Remove</th>
      </tr></thead>
      <tbody>	
        <tr ng-repeat="pallet in ctrl.inputs.pallets track by $index">
          <td><input ng-model="pallet.handle"/></td>
          <td><input type="number" min="0" ng-model="pallet.units"/></td>
          <td>
            <select ng-model="pallet.category">
              <option ng-repeat="cat in ctrl.inputs.categoryOptions">{{cat}}</option>
            </select>
          </td>
          <td><button class="btn btn-danger btn-xs" ng-click="ctrl.removePallet($index)"><span class="glyphicon glyphicon-remove"></span></button></td>
        </tr>
      </tbody>
    </table>
    <button class="btn btn-primary" ng-click="ctrl.addPallet()">Add Pallet</button>
  </div>
  <button class="btn btn-success" ng-click="ctrl.createShipment()">Create</button>
</div>
