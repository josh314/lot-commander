<div class="container" ng-controller="ReceivedPalletListCtrl as $ctrl">
  <h2>Received Pallets</h2>


	<div class="row well" style="display: flex; flex-direction: column">

    <div>
      <button class="btn btn-primary pull-right" ng-click="$ctrl.createPallet()">Create New Pallet</button>
      <fieldset class="col-xs-12 box-border">
        <legend class="box-border">Filter</legend>
        <div class="form-group col-xs-12 col-sm-6">
          <label for="palletHandleFilter">Pallet ID</label>
          <input class="form-control" name="palletHandleFilter" ng-model="$ctrl.filter.handle" ng-keyup="$ctrl.refreshPalletsList()">
        </div>
        <div class="form-group col-xs-12 col-sm-6">
          <label for="palletStatusFilter">Status</label>
          <select class="form-control" name="palletStatusFilter" ng-model="$ctrl.filter.status" ng-change="$ctrl.refreshPalletsList()">
            <option>not brokendown</option>
            <option>brokendown</option>
            <option>all</option>
          </select>
        </div>
      </fieldset>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline;">

      <div class="btn-group dropdown" ng-class="{ open: $ctrl.showColumnOptions }">
        <button type="button" class="btn btn-default dropdown-toggle" ng-click="$ctrl.toggleShowColumnOptions()">
          Columns <span class="caret"></span>
        </button>
        <ul class="dropdown-menu">
          <li ng-repeat="(columnKey, columnData) in $ctrl.columns" ng-show="columnData.optionAvailable" ng-click="$ctrl.toggleColumnActive( columnKey )">
            <a><label for="{{columnKey}}ColumnDisplayToggleInput">
              <input type="checkbox" id="{{columnKey}}ColumnDisplayToggleInput" ng-model="$ctrl.columns[columnKey].active"> {{ columnData.displayName}}
            </label></a>
          </li>
        </ul>
      </div>

      <ul uib-pagination
      total-items="$ctrl.pagination.totalItems"
      items-per-page="$ctrl.pagination.pageSize"
      ng-model="$ctrl.pagination.current"
      ng-change="$ctrl.pagination.pageChange()"
      class="pagination-sm pull-right"
  
      max-size="$ctrl.pagination.maxSize"
      boundary-links="true"
      boundary-link-numbers="true"
      force-ellipses="true"></ul>
  
    </div>
  
    <table class="table table-striped">
  
      <thead><tr>
        <th ng-repeat="(columnKey, columnData) in $ctrl.columns" ng-show="columnData.optionAvailable && columnData.active">
          <span ng-click="$ctrl.sortListBy(columnKey)" style="cursor: pointer;" ng-hide="columnData.noSort">
            {{columnData.displayName}}
            <span ng-show="columnKey === $ctrl.sortOpts.key">
              <span class="glyphicon glyphicon-triangle-bottom" ng-hide="$ctrl.sortOpts.ascending" style="font-size: .75em"></span>
              <span class="glyphicon glyphicon-triangle-top" ng-show="$ctrl.sortOpts.ascending" style="font-size: .75em"></span>
            </span>
          </span>
          <span ng-show="columnData.noSort">{{columnData.displayName}}</span>
        </th>
      </tr></thead>
  
      <tbody>
        <tr ng-repeat="pallet in $ctrl.pallets">
          <td ng-repeat="(columnKey, columnData) in $ctrl.columns" ng-show="columnData.optionAvailable && columnData.active" ng-switch="columnKey">
            <span ng-switch-when="shipment">
              <a ng-href="/receiving/shipments/{{pallet.shipment._id}}">{{ pallet.shipment.handle }}</a>
            </span>
            <span ng-switch-when="hasProblem">
              <span class="glyphicon glyphicon-alert" ng-show="pallet.hasProblem"></span>
            </span>
            <span ng-switch-when="note">
              <span ng-show="pallet.showNote">{{pallet.note}}</span>
              <span ng-show="pallet.note">[<a href ng-hide="pallet.showNote" ng-click="pallet.toggleShowNote()">Show</a><a href ng-show="pallet.showNote" ng-click="pallet.toggleShowNote()">Hide</a>]</span>
            </span>
            <span ng-switch-when="breakdown">
              <button type="button" class="btn btn-xs" ng-class="{ 'btn-danger': !pallet.isBrokendown, 'btn-success': pallet.isBrokendown }" ng-click="$ctrl.breakdownPallet( pallet )">
                {{ pallet.isBrokendown ? 'Undo breakdown' : 'Breakdown' }}
              </button>
            </span>
            <span ng-switch-default>{{ columnData.transform ? columnData.transform( pallet[ columnKey ] ) : pallet[ columnKey ] }}</span>
          </td>
        </tr>
      </tbody>
  
    </table>

  </div>


</div>
