<div class="modal-header">
	<h3 class="modal-title">Configure split group for remaining items</h3>
</div>

<div class="modal-body">

  <p>A split group will be created for any items leftover in the splitting process. Configure this group below.</p>

  <div class="panel panel-primary">
    <div class="panel-heading">Split group: {{ $ctrl.grp.label }}</div>
    <div class="panel-body">

      <div>

        <h4>Pallet</h4>

        <div class="row">

          <div class="form-group col-xs-12 col-sm-4" ng-class="{ 'has-error' : $ctrl.errors.duplicatePalletHandle }" >

            <label for="palletHandleInput">Handle</label>
            <input id="palletHandleInput" class="form-control" ng-model="$ctrl.edits.palletHandle" ng-change="$ctrl.onPalletHandleChange()">
            <span class="text-danger h6" ng-show="$ctrl.errors.duplicatePalletHandle">Duplicate handle in shipment</span>

          </div>

          <div class="form-group col-xs-12 col-sm-4">

            <label for="palletCategoryInput">Category</label>
            <select id="palletCategoryInput" class="form-control" ng-model="$ctrl.edits.category">
              <option ng-repeat="$option in $ctrl.categoryOptions" ng-value="$option.value">{{ $option.displayName }}</option>
            </select>

          </div>

          <div class="form-group col-xs-12 col-sm-4">

            <label for="palletConditionInput">Condition</label>
            <select id="palletConditionInput" class="form-control" ng-model="$ctrl.edits.condition">
              <option ng-repeat="$option in $ctrl.conditionOptions" ng-value="$option.value">{{ $option.displayName }}</option>
            </select>

          </div>

        </div>

        <div class="row">

          <div class="form-group col-xs-12 col-sm-4">

            <label for="palletToBeProcessedInput">To Be Processed?</label>
            <select id="palletToBeProcessedInput" class="form-control" ng-model="$ctrl.edits.toBeProcessed">
              <option ng-value="true">yes</option>
              <option ng-value="false">no</option>
            </select>

          </div>

          <div class="form-group col-xs-12 col-sm-4">

            <label for="palletToBeListedInput">To Be Listed?</label>
            <select id="palletToBeListedInput" class="form-control" ng-model="$ctrl.edits.toBeListed">
              <option ng-value="true">yes</option>
              <option ng-value="false">no</option>
            </select>

          </div>

          <div class="form-group col-xs-12 col-sm-4">

            <label for="is-allocated-for-unmanifested-lots__{{ $ctrl.grp.label }}">For unmanifested lots?</label>
            <select id="is-allocated-for-unmanifested-lots__{{ $ctrl.grp.label }}" class="form-control"
              ng-model="$ctrl.edits.isAllocatedForUnmanifestedLots">
              <option ng-value="true">yes</option>
              <option ng-value="false">no</option>
            </select>

          </div>

          <div class="form-group col-xs-12 col-sm-4">

            <label for="palletIsMissingInput">Composed of missing units?</label>
            <select id="palletIsMissingInput" class="form-control" ng-model="$ctrl.edits.isMissing">
              <option ng-value="true">yes</option>
              <option ng-value="false">no</option>
            </select>

          </div>

        </div>

        <div class="row">

          <div class="form-group col-xs-12 col-sm-4">
            <label for="unitsInput">Units</label>
            <input id="unitsInput" class="form-control" ng-value="$ctrl.grp.totalUnits()" disabled>
          </div>

        </div>

      </div>

      <div ng-show="$ctrl.edits.toBeListed">

        <h4>Lot</h4>

        <div class="row">

          <div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : $ctrl.errors.duplicateLotHandle }" >
            <label for="lotHandleInput">Handle</label>
            <input id="lotHandleInput" class="form-control" ng-model="$ctrl.edits.lotHandle" ng-change="$ctrl.onLotHandleChange()">
            <span class="text-danger h6" ng-show="$ctrl.errors.duplicateLotHandle">Duplicate lot handle</span>
          </div>

          <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.grp.lotNumber" >
            <label for="lotNumberInput">Lot Number</label>
            <input id="lotNumberInput" class="form-control" ng-model="$ctrl.grp.lotNumber" disabled>
          </div>

        </div>

      </div>

      <div>

        <div>

          <label for="shipping-items-section">Shipping Items</label>
          <div id="shipping-items-section">
            <shipping-items-dir
              shipping-items="$ctrl.edits.shippingItems"
              show-editing-controls="true"
              edit-shipping-items-cb="$ctrl.setShippingItems( shippingItems )">
            </shipping-items-dir>
          </div>

        </div>
      </div>

    </div>
  </div>


</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$ctrl.done()" ng-disabled="!$ctrl.validate()">Continue</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
