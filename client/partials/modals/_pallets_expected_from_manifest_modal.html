<div class="modal-header">
	<h3 class="modal-title">Create Pallets From File</h3>
</div>


<div class="modal-body">

	<div class="row" ng-hide="$ctrl.manifestLoaded">
    <div class="col-xs-6 row">
      <div class="form-group col-xs-12" ng-class="{ 'has-error' : $ctrl.noFileSelected }">
        <label for="fileInput">Manifest File</label>
        <input type="file" class="form-control" id="fileInput" required file-model="$ctrl.manifestFile">
        <span class="text-danger h4" ng-show="$ctrl.noFileSelected">Please select a file.</span>
      </div>
      <div class="form-group col-xs-12">
        <div class="checkbox">
          <label for="noHeaderRowInput">
            <input type="checkbox" id="noHeaderRowInput" ng-model="$ctrl.noHeaderRow">
            This manifest has no header row
          </label>
        </div>
      </div>
      <div class="form-group col-xs-12">
        <label for="skipFirstRowsInput">Skip first rows</label>
        <input type="number" id="skipFirstRowsInput" ng-model="$ctrl.skipFirstRows">
      </div>
    </div>
    <div class="col-xs-12">
      <button class="btn btn-primary" type="button" ng-click="$ctrl.loadManifest()">Load Manifest</button>
    </div>
	</div>

  <div class="row" ng-show="$ctrl.manifestLoaded && !$ctrl.palletsStaged">
    <div class="form-group">
      <label for="destinationMarketplaceInput">Pallet ID column</label>
      <select class="form-control" ng-model="$ctrl.palletIdColumn">
        <option ng-repeat="columnName in $ctrl.columnNames">{{ columnName }}</option>
      </select>
    </div>
    <button ng-click="$ctrl.previewPallets()">Preview pallets</button>
  </div>

  <div class="row" ng-show="$ctrl.palletsStaged">
    <div class="form-group col-xs-12" ng-repeat="palletName in $ctrl.palletNames">
      <input type="text" class="form-control" ng-model="palletName">
    </div>
  </div>

</div>


<div class="modal-footer">
    <span ng-show="$ctrl.palletsStaged">
      <button class="btn btn-primary" type="button" ng-click="$close( $ctrl.palletNames )">Create</button>
    </span>

    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
