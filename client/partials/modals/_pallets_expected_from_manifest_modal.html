<div class="modal-header" style="display: flex;">
	<span class="modal-title h3">Create Pallets From File</span>
  <span class="glyphicon glyphicon-remove" style="margin-left: auto;" ng-click="$dismiss()"></span>
</div>


<div class="modal-body">

  <div style="display: flex; justify-content: flex-end;">
    <button class="btn btn-sm btn-warning" type="button" ng-click="$ctrl.goBack()" ng-show="$ctrl.manifestLoaded || $ctrl.palletsStaged">Back</button>
  </div>

	<div class="row" ng-hide="$ctrl.manifestLoaded">
    <div class="col-xs-6 row">
      <div class="form-group col-xs-12">
        <div class="checkbox">
          <label for="noHeaderRowInput">
            <input type="checkbox" id="noHeaderRowInput" ng-model="$ctrl.noHeaderRow">
            This manifest has no header row
          </label>
        </div>
      </div>
      <div class="form-group col-xs-12">
        <label for="skipFirstRowsInput">Skip first rows</label>
        <input class="form-control" type="number" id="skipFirstRowsInput" ng-model="$ctrl.skipFirstRows">
      </div>
    </div>
	</div>

  <div class="row" ng-show="$ctrl.manifestLoaded && !$ctrl.palletsStaged">
    <div class="col-xs-6 row">
      <div class="form-group col-xs-12">
        <label for="destinationMarketplaceInput">Pallet ID column</label>
        <select class="form-control" ng-model="$ctrl.palletIdColumn">
          <option ng-repeat="columnName in $ctrl.columnNames">{{ columnName }}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row" ng-show="$ctrl.palletsStaged">
    <div class="col-xs-12 row">

      <p class="col-xs-12">Create pallets with these names?</p>

      <div class="form-group col-xs-12" ng-repeat="palletName in $ctrl.palletNames">
        <div class="input-group">
          <input type="text" class="form-control" ng-model="palletName">
          <span class="input-group-btn">
            <button class="btn btn-danger" type="button" ng-click="$ctrl.deletePallet( palletName )"><span class="glyphicon glyphicon-remove"></span></button>
          </span>
        </div>
      </div>
      
    </div>
  </div>

</div>


<div class="modal-footer">

    <!-- Visible before manifest is loaded from file -->
    <button class="btn btn-primary" type="button" ng-click="$ctrl.loadManifest()" ng-show="!$ctrl.manifestLoaded && !$ctrl.palletsStaged">Load Manifest</button>

    <!-- Visible after manifest is loaded from file but before pallet ID column chosen -->
    <button class="btn btn-primary" type="button" ng-click="$ctrl.stagePallets()"  ng-show="$ctrl.manifestLoaded && !$ctrl.palletsStaged">Preview pallets</button>

    <!-- Visible after pallet ID column chosen  -->
    <button class="btn btn-primary" type="button" ng-click="$close( $ctrl.palletNames )" ng-show="$ctrl.palletsStaged">Create</button>

    <!-- Always visible -->
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>

</div>
