<div>
  <div class="modal-header warning">
    <h3 class="modal-title" ng-class="$ctrl.messageSeverity">{{ $ctrl.message.header }}</h3>
  </div>
  <div class="modal-body warning">
    <div class="row">
      <div class="col-xs-12">
        <p ng-show="$ctrl.message.body">{{ $ctrl.message.body }}</p>
        <div ng-show="$ctrl.message.html" ng-bind-html="$ctrl.message.html"></div>
      </div>
    </div>
  </div>
  <div class="modal-footer warning">
    <button class="btn btn-danger" type="button" ng-click="$close( true )">{{ $ctrl.message.trueText || 'Yes' }}</button>
    <button class="btn btn-warning" type="button" ng-click="$close( false )">{{ $ctrl.message.falseText || 'No' }}</button>
  </div>
</div>
