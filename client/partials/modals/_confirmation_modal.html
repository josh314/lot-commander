<div>
  <div class="modal-header">
    <h3 class="modal-title" ng-class="messageSeverity">{{message.header}}</h3>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xs-12">
        <p ng-show="message.body">{{message.body}}</p>
        <div ng-show="message.html" ng-bind-html="message.html"></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-danger" type="button" ng-click="$close( true )">Yes</button>
    <button class="btn btn-warning" type="button" ng-click="$close( false )">No</button>
  </div>
</div>
