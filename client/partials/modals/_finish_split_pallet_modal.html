<div class="modal-header">
	<h3 class="modal-title">Finish splitting pallet</h3>
</div>
<div class="modal-body">
  <p>The following new consolidated pallets will be created:</p>
  <table class="table table-striped table-bordered">
    <thead>
      <th>Handle</th>
      <th>Category</th>
      <th>Condition</th>
      <th>To be Listed?</th>
      <th>Units</th>
    </thead>
    <tbody>
      <tr ng-repeat="$grp in $ctrl.splitGroups track by $index">
        <td>
          <div class="form-group" ng-class="{ 'has-error' : $grp.errors.duplicateHandle }" >
            <input class="form-control" ng-model="$grp.handle" ng-change="$ctrl.validate( $grp )">
            <span class="text-danger h6" ng-show="$grp.errors.duplicateHandle">Duplicate handle in shipment</span>
          </div>
        </td>
        <td>
          <select class="form-control" ng-model="$grp.category">
            <option ng-repeat="$option in $ctrl.categoryOptions" ng-value="$option.value">{{ $option.displayName }}</option>
          </select>
        </td>
        <td>
          <select class="form-control" ng-model="$grp.condition">
            <option ng-repeat="$option in $ctrl.conditionOptions" ng-value="$option.value">{{ $option.displayName }}</option>
          </select>
        </td>
        <td>
          <select class="form-control" ng-model="$grp.toBeListed">
            <option ng-value="true">yes</option>
            <option ng-value="false">no</option>
          </select>
        </td>
        <td>
          {{ $grp.totalUnits() }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close( { success: true } )" >Continue</button>
    <button class="btn btn-warning" type="button" ng-click="$close( { success: false } )">Cancel</button>
</div>
