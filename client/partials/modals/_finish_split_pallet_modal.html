  <div ng-repeat="$grp in $ctrl.splitGroups track by $index">
    <div class="panel panel-primary">
      <div class="panel-heading">Split group: {{ $grp.original.label }}</div>
      <div class="panel-body">

        <div>

          <h4>Pallet</h4>

          <div class="row">

            <div class="form-group col-xs-12 col-sm-4" ng-class="{ 'has-error' : $grp.errors.duplicatePalletHandle }" >
              <label for="palletHandleInput">Handle</label>
              <input id="palletHandleInput" class="form-control" ng-model="$grp.edits.palletHandle" ng-change="$ctrl.onPalletHandleChange( $grp )">
              <span class="text-danger h6" ng-show="$grp.errors.duplicatePalletHandle">Duplicate handle in shipment</span>
            </div>

            <div class="form-group col-xs-12 col-sm-4">
              <label for="unitsInput">Units</label>
              <input id="unitsInput" class="form-control" ng-value="$grp.original.totalUnits()" disabled>
            </div>

          </div>

        </div>

        <div ng-show="$grp.edits.toBeListed">

          <h4>Lot</h4>

          <div class="row">

            <div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : $grp.errors.duplicateLotHandle }" >
              <label for="lotHandleInput">Handle</label>
              <input id="lotHandleInput" class="form-control" ng-model="$grp.edits.lotHandle" ng-change="$ctrl.onLotHandleChange( $grp )">
              <span class="text-danger h6" ng-show="$grp.errors.duplicateLotHandle">Duplicate lot handle</span>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>


</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$ctrl.done()" ng-disabled="!$ctrl.validateAll()">Continue</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
