<div class="modal-header">
	<h3 class="modal-title">Pallet Group Parameters</h3>
</div>
<div class="modal-body">
	<div class="row">
    <div class="form-group col-xs-12">
      <label for="numPalletsInput">Number of pallets</label>
      <input class="form-control" type="number" id="numPalletsInput" ng-model="$ctrl.inputs.numPallets">
    </div>
    <div class="form-group col-xs-12" >
      <label for="handlePrefixInput">Pallet ID prefix</label>
      <input class="form-control" type="text" id="handlePrefixInput" ng-model="$ctrl.inputs.handlePrefix">
    </div>
    <div class="form-group col-xs-12">
      <label for="categoryInput">Category</label>
      <select class="form-control" id="categoryInput" ng-model="$ctrl.inputs.category">
        <option ng-repeat="option in $ctrl.categoryOptions">{{ option }}</option>
      </select>
    </div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$ctrl.finish()" ng-disabled="!$ctrl.validate()">Continue</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
