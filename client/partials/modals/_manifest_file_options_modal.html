<div class="modal-header">
	<h3 class="modal-title">Download Clean Manifest</h3>
</div>
<div class="modal-body">
	<div class="row">
    <div class="row form-group">
      <div class="col-xs-12">
        <label for="filenameInput">Filename</label>
        <input type="text" id="filenameInput" class="form-control" ng-model="manifestOptions.filename">
      </div>
      <div class="col-xs-12" ng-repeat="sheetName in manifestOptions.sheetNames">
        <label for="sheetname{{$index+1}}">Sheetname {{$index+1}}</label>
        <input type="text" id="sheetname{{$index+1}}" class="form-control" ng-model="sheetName.new">
      </div>
    </div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close(manifestOptions)">Download Manifest</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
