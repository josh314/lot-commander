<div class="modal-header">
	<h3 class="modal-title">Edit Lot Metadata</h3>
</div>
<div class="modal-body">
	<div class="row">

    <div class="col-xs-12">
      <editor-listing-title-dir lot="$ctrl.lot" invalid-title="$ctrl.invalidTitle"></editor-listing-title-dir>
    </div>

    <div class="col-xs-12">
      <editor-listing-body-dir lot="$ctrl.lot"></editor-listing-body-dir>
    </div>

		<div class="form-group col-xs-12 col-sm-6">
			<label for="handleInput">Handle</label>
			<input class="form-control" name="handle" id="handleInput" required ng-model="$ctrl.lot.handle">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
      <label for="lotNumberInput" style="display: flex; justify-content: space-between;">
        <span>Lot number</span>
        <small ng-show="!$ctrl.lot.lotNumber"><a href ng-click="$ctrl.generateLotNumber()">generate</a></small>
      </label>
			<input class="form-control" name="lotNumber" id="lotNumberInput" required ng-model="$ctrl.lot.lotNumber" disabled>
		</div>
    <div class="form-group col-xs-12 col-sm-6">
			<label for="categoryInput">Category</label>
			<select class="form-control" name="category" id="categoryInput" required ng-model="$ctrl.lot.category">
				<option ng-repeat="category in $ctrl.lotCategoryOptions">{{ category }}</option>
			</select>
    </div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="typeInput">Condition</label>
			<select class="form-control" name="type" id="typeInput" required ng-model="$ctrl.lot.type">
				<option ng-repeat="type in $ctrl.lotTypeEnum">{{ type }}</option>
			</select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
			<label for="packingTypeInput">Packaging Type <span class="glyphicon glyphicon-question-sign" ng-click="$ctrl.openPackagingTypeInfo()"></span></label>
			<select
        class="form-control"
        name="packagingType"
        id="packingTypeInput"
        required
        ng-model="$ctrl.lot.packagingType"
        ng-disabled="$ctrl.lot.shippingItems && $ctrl.lot.shippingItems.length > 0"
      >
				<option ng-repeat="packagingType in $ctrl.packagingTypeEnum">{{ packagingType }}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="destinationMarketplaceInput">Destination Marketplace</label>
			<select class="form-control" name="destinationMarketplace" id="destinationMarketplaceInput" ng-model="$ctrl.lot.destinationMarketplace">
				<option ng-repeat="marketplace in $ctrl.marketplaces">{{marketplace}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="statusInput">Status</label>
			<select class="form-control" name="status" id="statusInput" required ng-model="$ctrl.lot.status">
				<option ng-repeat="status in $ctrl.lotStatusEnum">{{status}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : ($ctrl.lot.numBoxes && $ctrl.lot.numBoxes < 0)}" ng-show="$ctrl.lot.numBoxes">
			<label for="numBoxesInput">Number of Boxes</label>
			<input type="number" class="form-control" name="numBoxes" id="numBoxesInput" required ng-model="$ctrl.lot.numBoxes">
			<span class="text-danger h4" ng-show="$ctrl.lot.numBoxes && $ctrl.lot.numBoxes < 0">Invalid number of boxes</span>
    </div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="manifestedInput">Manifested Lot?</label>
			<select class="form-control" name="manifested" id="manifestedInput" ng-model="$ctrl.lot.unmanifested">
				<option ng-value="true">No</option>
				<option ng-value="false">Yes</option>
			</select>
    </div>
		<div class="form-group col-xs-12">
			<label for="descriptionInput">Description</label>
			<input class="form-control" name="description" id="descriptionInput" ng-model="$ctrl.lot.description"/>
    </div>
    <div class="form-group col-xs-12" ng-hide="$ctrl.lot.numBoxes">
        <label for="shippingItems">Shipping Items</label>

        <div class="well" id="shippingItems">

          <shipping-items-dir
            shipping-items="$ctrl.lot.shippingItems"
            show-editing-controls="true"
            edit-shipping-items-cb="$ctrl.editShippingItemsCb( shippingItems )"
          >
          </shipping-items-dir>
        </div>
      </div>
		<div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.lot.unmanifested || $ctrl.lot.manifestFileLocation">
			<label for="totalUnitsInput">Total Units</label>
			<input class="form-control" id="totalUnitsInput" required ng-model="$ctrl.lot.totalUnits">
    </div>
    <div class="form-group col-xs-12 col-sm-6">
			<label for="estimatedRetailValueInput">Estimated Retail Value</label>
			<input class="form-control" id="estimatedRetailValueInput" required ng-model="$ctrl.lot.estimatedRetailValue" ng-disabled="!$ctrl.allowEditPricingData">
		</div>
    <div class="form-group col-xs-12 col-sm-6">
			<label for="priceValuePercentageInput">Price/value percentage</label>
			<input type="number" class="form-control" id="priceValuePercentageInput" ng-model="$ctrl.lot.priceValuePercentage" ng-disabled="!$ctrl.allowEditPricingData">
		</div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close($ctrl.lot)" ng-disabled="$ctrl.invalidLot()">Save edit data</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
