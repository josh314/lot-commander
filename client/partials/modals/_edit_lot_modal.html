<div class="modal-header">
	<h3 class="modal-title">Edit Lot Metadata</h3>
</div>
<div class="modal-body">
	<div class="row">
		<div class="form-group col-xs-12 col-sm-6">
			<label for="handleInput">Handle</label>
			<input class="form-control" name="handle" id="handleInput" required ng-model="lot.handle">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="typeInput">Type</label>
			<select class="form-control" name="type" id="typeInput" required ng-model="lot.type">
				<option ng-repeat="type in lotTypeEnum">{{type}}</option>
			</select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
			<label for="packingTypeInput">Packaging Type</label>
			<select class="form-control" name="packagingType" id="packingTypeInput" required ng-model="lot.packagingType">
				<option ng-repeat="packagingType in packagingTypeEnum">{{packagingType}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="descriptionInput">Description</label>
			<input class="form-control" name="description" id="descriptionInput" required ng-model="lot.description">
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="destinationMarketplaceInput">Destination Marketplace</label>
			<select class="form-control" name="destinationMarketplace" id="destinationMarketplaceInput" ng-model="lot.destinationMarketplace">
				<option ng-repeat="marketplace in marketplaces">{{marketplace}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="statusInput">Status</label>
			<select class="form-control" name="status" id="statusInput" required ng-model="lot.status">
				<option ng-repeat="status in lotStatusEnum">{{status}}</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : (lot.numBoxes && lot.numBoxes < 0)}">
			<label for="numBoxesInput">Number of Boxes</label>
			<input type="number" class="form-control" name="numBoxes" id="numBoxesInput" required ng-model="lot.numBoxes">
			<span class="text-danger h4" ng-show="lot.numBoxes && lot.numBoxes < 0">Invalid number of boxes</span>
		</div>
		<div class="form-group col-xs-12 col-sm-6">
			<label for="manifestedInput">Manifested Lot?</label>
			<select class="form-control" name="manifested" id="manifestedInput" ng-model="lot.unmanifested">
				<option ng-value="true">No</option>
				<option ng-value="false">Yes</option>
			</select>
		</div>
		<div class="form-group col-xs-12 col-sm-6" ng-show="lot.unmanifested || lot.manifestFileLocation">
			<label for="totalUnitsInput">Total Units</label>
			<input class="form-control" id="totalUnitsInput" required ng-model="lot.totalUnits">
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="lot.unmanifested || lot.manifestFileLocation">
			<label for="estimatedRetailValueInput">Estimated Retail Value</label>
			<input class="form-control" id="estimatedRetailValueInput" required ng-model="lot.estimatedRetailValue">
		</div>
		<div class="col-xs-12">
			<h3>Listings</h3>
			<div class="form-group" ng-class="{ 'has-error' : !verifyTitle()}">
				<label>Title</label>
				<input class="form-control" name="listingTitle" id="listingTitleinput" ng-keyup="verifyTitle()" ng-model="lot.listingData.title">
				<span class="text-danger h4" ng-show="titleTooLong.bstock && lot.destinationMarketplace ==='bstock'">Title too long for a Bstock Listing</span>
				<span class="text-danger h4" ng-show="titleTooLong.shopify && lot.destinationMarketplace ==='wholesaleninjas'">Title too long for a Shopify Listing</span>
			</div>
			<div>
				<label>Body (boilerplate omitted)</label>
				<textarea rows="15" class="form-control" name="listingBody" id="listingBodyInput" required ng-model="lot.listingData.body"></textarea>
			</div>
		</div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close(lot)" ng-disabled="invalidLot()">Save edit data</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
