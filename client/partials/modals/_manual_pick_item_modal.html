<div class="modal-header">
	<h3 class="modal-title">Manually pick item</h3>
</div>
<div class="modal-body">
  <div class="form-group">
    <label for="ScanLabelInput">Scan Label</label>
    <input id="ScanLabelInput" name="ScanLabelInput" class="form-control" ng-model="$ctrl.label" ng-keyup="$event.keyCode == 13 && $ctrl.scanLabel()" autocomplete="off" />
  </div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$close()">Continue without scan</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
