<div class="modal-header">
	<h3 class="modal-title">Name split group</h3>
</div>
<div class="modal-body">
	<div class="row">

    <div class="col-xs-12">
      <div class="col-xs-12 col-sm-6">
        <label for="label-type-input">Group Type</label>
        <select class="form-control" id="label-type-input" ng-model="$ctrl.edits.labelType" ng-change="$ctrl.onLabelTypeChange()">
          <option ng-repeat="$labelType in $ctrl.labelTypeOptions" ng-value="$labelType.value">{{ $labelType.name }}</option>
        </select>
      </div>
      <div class="col-xs-12 col-sm-6" ng-class="{ 'has-error' : $ctrl.errors.duplicatePalletHandle || $ctrl.errors.duplicateSplitGroupLabel }">
        <label for="custom-label-input">Group Name</label>
        <input class="form-control"  id="custom-label-input" ng-model="$ctrl.edits.label" ng-change="$ctrl.onLabelChange()"  ng-disabled="$ctrl.edits.labelType !== null">
        <span class="text-danger h6" ng-show="$ctrl.errors.duplicateSplitGroupLabel">This split group name already exists.</span>
        <span class="text-danger h6" ng-show="$ctrl.errors.duplicatePalletHandle">This split group name will clash with another pallet in this shipment.</span>
      </div>
    </div>

	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="$ctrl.save()" ng-disabled="!$ctrl.validate()">Save name edit</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
