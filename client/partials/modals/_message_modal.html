<div class="modal-header">
  <h3 class="modal-title" ng-class="$ctrl.messageSeverity">{{ $ctrl.message.header }}</h3>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-xs-12">
      <p ng-show="$ctrl.message.body">{{ $ctrl.message.body }}</p>
      <div ng-show="$ctrl.message.html" ng-bind-html="$ctrl.message.html"></div>
    </div>
  </div>
</div>
<div class="modal-footer">
    <button class="btn btn-success" type="button" ng-click="$dismiss()">Close</button>
</div>
