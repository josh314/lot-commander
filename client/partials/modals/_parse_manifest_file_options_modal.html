<div class="modal-header" style="display: flex;">
	<span class="modal-title h3">Parse manifest file options</span>
  <span class="glyphicon glyphicon-remove" style="margin-left: auto;" ng-click="$dismiss()"></span>
</div>


<div class="modal-body">

  <div class="row">
    <div class="form-group col-xs-12">
      <strong>File</strong>: {{ $ctrl.filename }}
    </div>
    <div class="form-group col-xs-12">
      <div class="checkbox">
        <label for="noHeaderRowInput">
          <input type="checkbox" id="noHeaderRowInput" ng-model="$ctrl.options.noHeaderRow">
          This manifest has no header row
        </label>
      </div>
    </div>
    <div class="form-group col-xs-12">
      <label for="skipFirstRowsInput">Skip first rows</label>
      <input class="form-control" type="number" id="skipFirstRowsInput" ng-model="$ctrl.options.skipFirstRows">
    </div>
    <div class="form-group col-xs-12">
      <label for="skipLastRowsInput">Skip last rows</label>
      <input class="form-control" type="number" id="skipLastRowsInput" ng-model="$ctrl.options.skipLastRows">
    </div>
  </div>

</div>


<div class="modal-footer">

    <button class="btn btn-primary" type="button" ng-click="$close( $ctrl.options )" >Continue</button>

    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>

</div>
