<div class="modal-header">
	<h3 class="modal-title">Package label data</h3>
</div>
<div class="modal-body">
	<div class="row">
        <div class="form-group col-xs-12 col-sm-6">
            <label for="categoryInput">Category</label>
            <select class="form-control" name="category" id="categoryInput" ng-model="$ctrl.inputs.data.category">
                <option ng-repeat="category in $ctrl.inputs.categoryOptions">{{ category }}</option>
            </select>
        </div>
        <div class="form-group col-xs-12 col-sm-6">
            <label for="conditionInput">Condition</label>
            <select class="form-control" name="condition" id="conditionInput" ng-model="$ctrl.inputs.data.condition">
                <option ng-repeat="condition in $ctrl.inputs.conditionOptions">{{ condition }}</option>
            </select>
        </div>
        <div class="form-group col-xs-12 col-sm-6">
            <label for="unitsInput">Units per package</label>
            <input type="number" class="form-control" name="units" id="unitsInput" required ng-model="$ctrl.inputs.data.units"/>
        </div>
        <div class="form-group col-xs-12 col-sm-6">
            <label for="numPackageInput">Number of packages</label>
            <input type="number" class="form-control" name="numPackage" id="numPackageInput" required ng-model="$ctrl.inputs.data.numPackage"/>
        </div>
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-danger" type="button" ng-click="$close( $ctrl.inputs.data )" ng-disabled="!$ctrl.inputs.data.numPackage">Next</button>
    <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
</div>
