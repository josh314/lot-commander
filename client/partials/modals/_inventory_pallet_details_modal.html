<div class="modal-header">
  <h3 class="modal-title">Pallet Details</h3>
</div>
<div class="modal-body">
  <div class="row">
    <div class="form-group col-xs-12 col-sm-6" ng-class="{ 'has-error' : $ctrl.errors.emptyHandle || $ctrl.errors.duplicateHandle }">
      <label for="handleInput">Handle</label>
      <input class="form-control" type="text" id="handleInput" ng-model="$ctrl.inputs.handle" ng-change="$ctrl.validate()" ng-disabled="$ctrl.disableEditing">
      <span class="text-danger h4" ng-show="$ctrl.errors.duplicateHandle">Duplicate handle</span>
      <span class="text-danger h4" ng-show="$ctrl.errors.emptyHandle">Missing handle</span>
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.showDeveloper">
      <label for="_idInput">_id (development use only)</label>
      <input class="form-control" type="text" id="_idInput" ng-model="$ctrl.inputs._id" disabled>
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.showShipment">
      <label for="shipmentInput" style="display: flex; justify-content: space-between;">
        <span>Shipment</span>
        <small ng-show="$ctrl.allowShipmentNavigation"><a href ng-click="$ctrl.navigateToShipment()">view shipment details</a></small>
      </label>
      <input class="form-control" type="text" id="shipmentInput" ng-model="$ctrl.inputs.shipment.handle" disabled>
    </div>
    <div class="form-group col-xs-12 col-sm-6"  ng-class="{ 'has-error' : $ctrl.errors.invalidCost }" ng-show="$ctrl.showPurchasingData">
      <label for="costInput">Cost</label>
      <input class="form-control" type="number" id="costInput" ng-model="$ctrl.inputs.cost" ng-change="$ctrl.validate()" ng-disabled="$ctrl.disableEditing">
      <span class="text-danger h6" ng-show="$ctrl.errors.invalidCost">Invalid cost</span>
    </div>
    <div class="form-group col-xs-12 col-sm-6" >
      <label for="unitsInput">Units</label>
      <input class="form-control" type="number" id="unitsInput" ng-model="$ctrl.inputs.units" ng-disabled="$ctrl.disableEditing">
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="numUnitsRemovedInput" style="display: flex; justify-content: space-between;">
        <span>Number of removed units</span>
        <a href ng-click="$ctrl.viewRemovedItems()">view list</a>
      </label>
      <input class="form-control" type="number" id="numUnitsRemovedInput" ng-value="$ctrl.pallet.getTotalUnitsRemoved()" disabled>
    </div>
    <div class="form-group col-xs-12 col-sm-6" >
      <label for="retailValueInput">Retail Value</label>
      <input class="form-control" type="number" id="retailValueInput" ng-model="$ctrl.inputs.retailValue" ng-disabled="$ctrl.disableEditing || !$ctrl.allowEditPricingData">
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="priceValuePercentageInput">Price/value percentage</label>
      <input class="form-control" type="number" id="priceValuePercentageInput" ng-model="$ctrl.inputs.priceValuePercentage" ng-disabled="$ctrl.disableEditing || !$ctrl.allowEditPricingData">
    </div>
    <div class="form-group col-xs-12 col-sm-6" >
      <label for="salePriceInput">Sale Price</label>
      <input class="form-control" type="number" id="salePriceInput" ng-model="$ctrl.inputs.salePrice" ng-disabled="$ctrl.disableEditing">
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="categoryInput">Category</label>
      <select class="form-control" id="categoryInput" ng-model="$ctrl.inputs.category" ng-disabled="$ctrl.disableEditing">
        <option ng-repeat="option in $ctrl.categoryOptions" ng-value="option.value">{{ option.displayName }}</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="conditionInput">Condition</label>
      <select class="form-control" id="conditionInput" ng-model="$ctrl.inputs.condition" ng-disabled="$ctrl.disableEditing">
        <option ng-repeat="option in $ctrl.conditionOptions" ng-value="option.value">{{ option.displayName }}</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="toBeListedInput">To Be Listed?</label>
      <select class="form-control" id="toBeListedInput" ng-model="$ctrl.inputs.toBeListed" ng-disabled="$ctrl.disableEditing">
        <option ng-value="true">yes</option>
        <option ng-value="false">no</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="isAnonymousInput">Anonymous?</label>
      <select class="form-control" id="isAnonymousInput" ng-model="$ctrl.inputs.isAnonymous" disabled>
        <option ng-value="true">yes</option>
        <option ng-value="false">no</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="hasProblemInput">Has problem?</label>
      <select class="form-control" id="hasProblemInput" ng-model="$ctrl.inputs.hasProblem" ng-disabled="$ctrl.disableEditing">
        <option ng-value="true">yes</option>
        <option ng-value="false">no</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.showCreatedAtDate">
      <label for="createdAtInput">Created date</label>
      <input class="form-control" type="date" id="createdAtInput" ng-model="$ctrl.inputs.createdAt" disabled>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="isRepackedInput">Repacked?</label>
      <select class="form-control" id="isRepackedInput" ng-model="$ctrl.inputs.isRepacked" ng-disabled="$ctrl.disableEditing">
        <option ng-value="true">yes</option>
        <option ng-value="false">no</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.showRepackedDate">
      <label for="repackedDateInput">Repacked date</label>
      <input class="form-control" type="date" id="repackedDateInput" ng-model="$ctrl.inputs.repackedDate" disabled>
    </div>
    <div class="form-group col-xs-12 col-sm-6">
      <label for="isBrokendownInput">Broken down?</label>
      <select class="form-control" id="isBrokendownInput" ng-model="$ctrl.inputs.isBrokendown" ng-disabled="$ctrl.disableEditing">
        <option ng-value="true">yes</option>
        <option ng-value="false">no</option>
      </select>
    </div>
    <div class="form-group col-xs-12 col-sm-6" ng-show="$ctrl.showBrokendownDate">
      <label for="brokendownDateInput">Breakdown date</label>
      <input class="form-control" type="date" id="brokendownDateInput" ng-model="$ctrl.inputs.brokendownDate" disabled>
    </div>
    <div class="form-group col-xs-12">
      <label for="noteInput">Note</label>
      <textarea class="form-control" rows=2 id="noteInput" ng-model="$ctrl.inputs.note"></textarea ng-disabled="$ctrl.disableEditing">
    </div>
  </div>
</div>
<div class="modal-footer">
    <span ng-hide="$ctrl.disableEditing">
      <button class="btn btn-primary" type="button" ng-click="$ctrl.finish()" ng-disabled="!$ctrl.validate()">Save</button>
      <button class="btn btn-warning" type="button" ng-click="$dismiss()">Cancel</button>
    </span>
    <span ng-show="$ctrl.disableEditing">
      <button class="btn btn-warning" type="button" ng-click="$dismiss()">Close</button>
    </span>
</div>
