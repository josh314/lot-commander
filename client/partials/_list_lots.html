<div class="container" id="contact">
	<div class="row well">
		<h2>Lots</h2>
		<fieldset class="col-xs-12 box-border">
			<legend class="box-border">Filter</legend>
			<div class="form-group col-xs-12 col-sm-6">
				<label for="lotHandleFilter">Handle</label>
				<input class="form-control" name="lotHandleFilter" ng-model="lotHandle" ng-keyup="update()">
			</div>
			<div class="form-group col-xs-12 col-sm-6">
				<label for="lotStatusFilter">Status</label>
				<select class="form-control" name="lotStatusFilter" ng-model="lotStatus" ng-change="update()">
					<option ng-repeat="status in ['All'].concat(statusOptions)">{{status}}</option>
				</select>
			</div>
		</fieldset>
		<table class="table table-striped">
			<thead><tr>
				<th>Handle</th>
				<th>Total Units</th>
				<th>Created</th>
				<th>Last Updated</th>
				<th>Status</th>
				<th>Marketplace</th>
				<th></th>
				<th></th>
			</tr></thead>
			<tbody>	
				<tr ng-repeat="lot in lots">
					<td><a ng-href="lots/view/{{lot._id}}">{{lot.handle}}</a></td>
				    <td>{{lot.totalUnits ? lot.totalUnits : '---'}}</td>
				    <td>{{lot.readableCreatedAt}}</td>
				    <td>{{lot.readableUpdatedAt}}</td>
				    <td>{{lot.status}}</td>
				    <td>
			    		<select ng-model="lot.destinationMarketplace" ng-change="saveLot(lot)">
			    			<option ng-repeat="marketplace in marketplaces">{{marketplace}}</option>
				    	</select>
				    </td>
	                <td>
	                	<span>
		                	<button class="btn btn-success btn-xs" ng-click="scanItems(lot._id)" ng-disabled="lot.unmanifested">Scan Items</button>
		                </span>
		            </td>
	                <td>
	                	<span>
		                	<button class="btn btn-success btn-xs" ng-click="requestFile(lot)" ng-disabled="lot.unmanifested">Create Manifest File</button>
		                </span>
		            </td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
