<div class="container well" ng-controller="GalleryCtrl as $ctrl" >

  <div class="lot-type-gallery" ng-show="$ctrl.galleryType === 'lot'">

    <h3>Product Gallery</h3>
    <div class="row" style="margin-left: 8px; margin-right: 8px;">
      <div id="gallery-container" class="row">
        <div ng-repeat="item in $ctrl.items">
          <div ng-show="item.images.length">
            <h4 class="text-center">{{item.barcode}} - {{item.description}}</h4>
            <div class="row">
              <div class="col-xs-6 col-sm-4 col-md-3 col-lg-1" ng-repeat="image in item.images track by $index">
                <a ng-href="{{image.src}}"><img class="img-responsive" ng-src="{{image.src}}"></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    <!-- 	<div class="row">
        <div ng-repeat="item in $ctrl.lot.getInventorySortedByBarcode()">
          <h5>{{item.barcode}} - {{item.description}}</h5>
          <div class="row">
            <div class="col-xs-6 col-sm-4 col-md-3 col-lg-1" ng-repeat="image in item.images track by $index">
              <a ng-href="{{image}}"><img class="img-responsive" ng-src="{{image}}"></a>
            </div>
          </div>
        </div>
      </div> -->
    </div>

  </div>


  <div class="pallet-type-gallery" ng-show="$ctrl.galleryType === 'pallet'">
    <h3>Product Gallery</h3>
    <div class="row" style="margin-left: 8px; margin-right: 8px;">
    <div ng-repeat="$item in $ctrl.palletProducts track by $index">
      <div id="gallery-container" class="row">
        <dl>
          <dt>UPC</dt>
          <dd>{{ $item.upc }}</dd>
          <dt>Title</dt>
          <dd>{{ $item.title }}</dd>
        </dl>
        <div class="col-xs-6 col-sm-4 col-md-3 col-lg-1" ng-repeat="image in $item.images track by $index">
          <a ng-href="{{image}}"><img class="img-responsive" ng-src="{{image}}"></a>
        </div>
      </div>
    </div>
  </div>

</div>
