<div ng-controller="GalleryCtrl as $ctrl">

  <div id="collage-section-container" class="container well">

    <h3>Collage</h3>
    <div style="display:flex; flex-direction:column; align-items:center;" ng-show="$ctrl.showCollage">

      <collage-dir
        lot-id="$ctrl.lot._id"
        save-cb="$ctrl.saveCollageCb()"
        do-render="$ctrl.renderCollage"
        disable-preview-modal="true"
        is-primary-image="$ctrl.isPrimaryImage"
      ></collage-dir>

      <div class="button-row-container" style="margin-top:8px;">
        <button class="btn btn-primary" ng-click="$ctrl.goBackToLot()">Back to lot</button>
      </div>

    </div>

    <div style="display:flex; flex-direction:column; align-items:center;" ng-hide="$ctrl.showCollage">

      <div class="button-row-container" style="margin-top:30px;">
        <button class="btn btn-primary" ng-click="$ctrl.goBackToLot()">Back to lot</button>
        <button class="btn btn-primary" ng-click="$ctrl.revealAndRenderCollage()">Render collage</button>
      </div>

    </div>

  </div>

  <div id="gallery-container" class="container well">

    <div class="lot-type-gallery">

      <h3>Product Gallery</h3>
      <div class="row" style="margin-left: 8px; margin-right: 8px;">
        <div id="gallery-container" class="row">
          <div ng-repeat="$item in $ctrl.galleryItems">
            <div class="gallery-item__content-container" ng-show="$item.images.length">
              <dl>
                <dt>UPC</dt>
                <dd>{{ $item.upc }}</dd>
                <dt>Title</dt>
                <dd>{{ $item.title }}</dd>
              </dl>
              <div class="gallery-item__item-images">
                <div class="gallery-item__image-container" ng-repeat="$image in $item.images track by $index">
                  <a ng-click="$ctrl.previewImage( $image )"><img class="img-responsive img-thumbnail" ng-src="{{$image.src}}"></a>
                </div>
              </div>
              <div class="gallery-item__review-images-button-container">
                <button class="btn btn-primary btn-xs" ng-click="$ctrl.reviewImages($item)">review images</button>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

</div>
