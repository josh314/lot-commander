<div class="container" ng-controller="OrderPicklistController as ctrl">
	<div class="row">
		<div class="col-xs-12">
			<div class="panel panel-default">
				<div class="panel-heading">
					<h3 class="panel-title">Order Details</h3> 
        </div>
        <div class="panel-body flex-row">
          <div class="flex-row-item">
            <b>Order Number: </b>{{ ctrl.order.number }}<br>
            <b>Channel: </b>{{ ctrl.order.channel }}<br>
            <b>Date: </b>{{ ctrl.order.displayDate }}<br>
            <b>Pick Status: </b>{{ ctrl.order.status }}<br>
          </div>
          <div class="flex-row-divider"></div>
          <div class="flex-row-item">
            <button class="btn btn-sm btn-primary" ng-click="ctrl.printPickReceipt()" ng-disabled="ctrl.order.status !== 'done'">Print Pick Receipt</button>
          </div>
        </div>
      </div>
      <div class="panel panel-default">
          <div class="panel-heading flex-row">
            <div class="form-group flex-row-item">
              <label for="PickItemScanInput">Scan Pick Item</label>
              <input name="PickItemScanInput" class="form-control" ng-model="ctrl.barcode" ng-keyup="$event.keyCode == 13 && ctrl.scanBarcode()" autocomplete="off" />
            </div>
            <div class="flex-row-divider"></div>
            <div class="flex-row-item">
              <button class="btn btn-danger btn-sm" ng-click="ctrl.refreshPicklist()">Force Refresh</button>
            </div>
          </div>
          <div class="panel-body">
            <table class="table table-striped">
                <thead><tr>
                  <th>Handle</th>
                  <th>Title</th>
                  <th>Total</th>
                  <th>Scanned</th>
                  <th>Status</th>
                  <th></th>
                </tr></thead>
                <tbody>	
                  <tr ng-repeat="lot in ctrl.order.picklist">
                    <td>{{ lot.handle }}</td>
                    <td>{{ lot.title }}</td>
                    <td>{{ lot.total ? lot.total : 'unknown' }}</td>
                    <td>{{ lot.scanned }}</td>
                    <td><span class="glyphicon glyphicon-ok" ng-show="lot.picked"></span></td>
                    <td><button class="btn btn-xs btn-warning" ng-click="ctrl.markAsPicked($index)">Mark as picked</button></td>
                  </tr>
                </tbody>
              </table>
          </div>
      </div>
      </div>
    </div>
  </div>
</div>
