<div class="container" ng-controller="StoreShippingRatesCtrl as $ctrl">

  <div class="row well">

		<h2>Store Shipping Rates</h2>

    <fieldset class="col-xs-12 box-border">
      <legend class="box-border">Default rates</legend>

      <div ng-hide="$ctrl.waiting.defaultRates">

        <table class="table" style="margin-bottom:0px;">

          <tbody>
            <tr>
              <td>
                <input class="form-control" ng-model="$ctrl.defaultBoxRateDisplayRate.name" disabled/>
              </td>
              <td>
                <div class="form-group" ng-class="{ 'has-error' : $ctrl.defaultBoxRateDisplayRate.isDirty() }" style="margin-right:20px;">
                  <input type="number" id="rate-input-{{$index}}" class="form-control" ng-model="$ctrl.defaultBoxRateDisplayRate.displayValue" ng-keyup="$event.keyCode == 13 && $ctrl.saveDefaultBoxRate()"/>
                </div>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-sm btn-success" ng-click="$ctrl.saveDefaultBoxRate()" style="margin-top:4px;">Save</button>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-sm btn-warning" ng-click="$ctrl.clearRate(  $ctrl.defaultBoxRateDisplayRate )" style="margin-top:4px;">Clear change</button>
              </td>
            </tr>
            <tr>
              <td>
                <input class="form-control" ng-model="$ctrl.palletBreakdownServiceDisplayRate.name" disabled/>
              </td>
              <td>
                <div class="form-group" ng-class="{ 'has-error' : $ctrl.palletBreakdownServiceDisplayRate.isDirty() }" style="margin-right:20px;">
                  <input type="number" id="rate-input-{{$index}}" class="form-control" ng-model="$ctrl.palletBreakdownServiceDisplayRate.displayValue" ng-keyup="$event.keyCode == 13 && $ctrl.savePalletBreakdownServiceRate()"/>
                </div>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-sm btn-success" ng-click="$ctrl.savePalletBreakdownServiceRate()" style="margin-top:4px;">Save</button>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-sm btn-warning" ng-click="$ctrl.clearRate( $ctrl.palletBreakdownServiceDisplayRate )" style="margin-top:4px;">Clear change</button>
              </td>
            </tr>
          </tbody>

        </table>

      </div>

      <div class="col-xs-12" ng-show="$ctrl.waiting.defaultRates">
        <div class="center-block loader"></div>
        <h2 class="text-center">Please wait...</h2>
      </div>

    </fieldset>

    <h3>Individual product rates</h3>

		<fieldset class="col-xs-12 box-border">
			<legend class="box-border">Filter</legend>
			<div class="form-group col-xs-12 col-sm-6">
				<label for="productNameFilter">Product name</label>
				<input class="form-control" name="productNameFilter" ng-model="$ctrl.filter.productName" ng-keyup="$ctrl.refreshVisibleDisplayRates()">
			</div>
      <div class="form-group col-xs-12 col-sm-6">
				<label for="packageTypeFilter">Package Type</label>
				<select class="form-control" name="packageTypeFilter" ng-model="$ctrl.filter.packageType" ng-change="$ctrl.refreshRates()">
          <option ng-value="null">---</option>
          <option>lots</option>
					<option>pallets</option>
				</select>
			</div>
		</fieldset>

    <div ng-show="$ctrl.filter.packageType">

      <div ng-hide="$ctrl.waiting.listingRates" style="margin-top:12px;">
        <p>
          Note: Blank fields indicate default rates will be used. All values are in USD ($)
        </p>
        <table class="table table-striped">

          <thead><tr>
            <th>Title</th>
            <th>Rate</th>
            <th></th> <!-- save -->
            <th></th> <!-- clear -->
          </tr></thead>

          <tbody>
            <tr ng-repeat="$displayRate in $ctrl.visibleDisplayRates">
              <td>{{ $displayRate.name }}</td>
              <td>
                <div class="form-group" ng-class="{ 'has-error' : $displayRate.isDirty() }">
                  <input type="number" id="rate-input-{{$index}}" class="form-control" ng-model="$displayRate.displayValue" ng-keyup="$event.keyCode == 13 && $ctrl.saveRate( $displayRate.gid, index )"/>
                </div>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-xs btn-success" ng-click="$ctrl.saveRate( $displayRate.gid, index )">Save</button>
              </td>
              <td>
                <button tabIndex="-1" class="btn btn-xs btn-warning" ng-click="$ctrl.clearRate( $displayRate )">Clear change</button>
              </td>
            </tr>
          </tbody>

        </table>
      </div>

      <div class="col-xs-12" ng-show="$ctrl.waiting.listingRates">
        <div class="center-block loader"></div>
        <h2 class="text-center">Please wait...</h2>
      </div>

    </div>

  </div>

</div>
