<div class="lot-image-grid-directive">

  <div class="row" ng-if="$ctrl.lot">
    <div class="col-xs-12 col-sm-4" ng-repeat="$image in $ctrl.lot.images">
      <a href ng-click="$ctrl.openImagePreviewModal( $image )">
        <img id="{{ $image._id }}" ng-src="{{$ctrl.lot.getImageLink( $image )}}" class="img-thumbnail primary-image">
      </a>
      <!-- Checkbox to make primary -->
      <div class="lot-image-grid__controls-footer">

        <div class="checkbox lot-image-grid__controls-footer__checkbox-container">
          <label for="primary-{{ $image._id }}">
            <input type="checkbox" id="primary-{{ $image._id }}" ng-model="$image.primary" ng-click="$ctrl.updatePrimaryImage( $image._id )">
            Primary
          </label>
        </div>

        <div class="lot-image-grid__controls-footer__divider"></div>

        <div class="lot-image-grid__controls-footer__buttons-container">
          <div ng-hide="$ctrl.hideEditControls">
            <button class="btn btn-warning btn-xs" ng-click="$ctrl.editImage( $image )"><span class="glyphicon glyphicon-pencil"></span> Edit</button>
          </div>
          <div>
            <button class="btn btn-danger btn-xs" ng-click="$ctrl.removeImage( $image )">Remove</button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
