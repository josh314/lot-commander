<div class="container" id="contact" ng-controller="SiteAnnouncementsCtrl as $ctrl">
	<div class="row">
		<h2>Manage site announcements</h2>
    <div class="row well" ng-show="$ctrl.announcements && $ctrl.announcements.length">

      <h3>All announcements</h3>
      <p>Active announcements are displayed in a pop-up when users login.
      Inactive announcements are highlighted in <span class="text-danger">red</span></p>

      <div class="col-xs-12 col-sm-6" ng-repeat="$announcement in $ctrl.announcements track by $index">

        <div class="panel" ng-class="{ 'panel-primary': $announcement.isActive, 'panel-danger': !$announcement.isActive }">

          <div class="panel-heading">
          </div>

          <div class="panel-body">

              <dl>

                <dt>Header</dt>
                <dd ng-hide="$announcement.isEditing">{{ $announcement.header }}</dd>
                <dd ng-show="$announcement.isEditing">
                  <input type="text" class="form-control" ng-model="$announcement.edits.header" />
                </dd>

                <dt>Body</dt>
                <dd ng-hide="$announcement.isEditing">{{ $announcement.body }}</dd>
                <dd ng-show="$announcement.isEditing">
                  <textarea rows="3" class="form-control" ng-model="$announcement.edits.body"></textarea>
                </dd>

                <dt>Is active?</dt>
                <dd ng-hide="$announcement.isEditing">
                  {{ $announcement.isActive ? 'Yes' : 'No' }}
                </dd>
                <dd ng-show="$announcement.isEditing">
                  <select class="form-control" ng-model="$announcement.edits.isActive">
                    <option ng-value="true">Yes</option>
                    <option ng-value="false">No</option>
                  </select>
                </dd>

              </dl>

              <div class="controls-row-xs controls-row-right" ng-hide="$announcement.isEditing">
                <button class="btn-primary" ng-click="$announcement.startEditing()">Edit</button>
                <button class="btn-primary" ng-click="$ctrl.displayAnnouncement( $announcement )">Show preview</button>
                <button class="btn-danger" ng-click="$ctrl.deleteAnnouncement( $announcement )">Remove</button>
              </div>

              <div class="controls-row-xs controls-row-right" ng-show="$announcement.isEditing">
                <button class="btn-success" ng-click="$announcement.saveEdits()">Save</button>
                <button class="btn-danger" ng-click="$announcement.cancelEditing()">Cancel</button>
                <button class="btn-primary" ng-click="$ctrl.displayAnnouncement( $announcement.edits )">Show preview</button>
              </div>

          </div>

        </div>

      </div>

    </div>

	</div>

  <div class="row well">

    <h3>Add new announcement</h3>

    <form name="addAnnouncementForm">

      <div class="form-group">
        <label for="headerInput">Header</label>
        <input type="text" class="form-control" name="header" id="headerInput" ng-model="$ctrl.newAnnouncement.header" />
      </div>

      <div class="form-group">
        <label for="bodyInput">Body</label>
        <textarea rows="6" class="form-control" name="body" id="bodyInput" ng-model="$ctrl.newAnnouncement.body"></textarea>
      </div>

			<div class="form-group">
				<label for="isActiveInput">Activate upon creation?</label>
				<select class="form-control" name="isActive" id="isActiveInput" ng-model="$ctrl.newAnnouncement.isActive">
					<option ng-value="true">Yes</option>
					<option ng-value="false">No</option>
				</select>
      </div>

      <div class="controls-row-sm controls-row-right">
        <button class="btn-primary" ng-click="$ctrl.previewAnnouncement()">Show preview</button>
        <button class="btn-success" ng-click="$ctrl.createAnnouncement()">Create announcement</button>
      </div>

    </form>

  </div>
</div>
