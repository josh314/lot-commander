<div class="container" ng-controller="StoreContentCtrl as $ctrl">

  <h1>Store content</h1>

  <div ng-hide="$ctrl.waitingForResponse">
    <div class="row well" ng-repeat="$group in $ctrl.displayContentGroups">

      <h2>{{ $group.name }}</h2>

      <table class="table table-striped">

        <thead><tr>
          <th ng-show="$ctrl.showDeveloper"></th> <!-- delete -->
          <th>Key</th>
          <th>Data type</th>
          <th>Production</th>
          <th>Staging</th>
          <th>To stage</th>
          <th></th> <!-- save -->
        </tr></thead>

        <tbody>
          <tr ng-repeat="$displayContent in $group.content" ng-switch="$displayContent.type">
            <td ng-show="$ctrl.showDeveloper">
              <button tabIndex="-1" class="btn btn-xs btn-danger" ng-click="$ctrl.deleteContent( $displayContent )"><span class="glyphicon glyphicon-remove"></span></button>
            </td>

            <td>{{ $displayContent.subkey }}</td>
            <td>{{ $displayContent.displayType }}</td>

            <td>
              <div class="form-group">
                <!-- booleans -->
                <select ng-switch-when="boolean"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'prod' ]"
                      disabled
                    >
                  <option>true</option>
                  <option>false</option>
                </select>
                <!-- numbers -->
                <input ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                      type="number"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'prod' ]"
                      disabled
                    />
                <!-- objects as JSON -->
                <textarea ng-switch-when="json"
                          id="content-input-{{$displayContent.key}}-prod"
                          class="form-control"
                          rows="{{$displayContent.value[ 'prod' ].split('\n').length}}"
                          ng-model="$displayContent.value[ 'prod' ]"
                          disabled
                        ></textarea>
                <!-- multi-line text -->
                <textarea ng-switch-when="multi_line_text_field"
                          id="content-input-{{$displayContent.key}}-prod"
                          class="form-control"
                          rows="{{$displayContent.value[ 'prod' ].split('\n').length}}"
                          ng-model="$displayContent.value[ 'prod' ]"
                          disabled
                        ></textarea>
                <!-- Default to single-line text input -->
                <input ng-switch-default
                      type="text"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'prod' ]"
                      disabled
                    />

              </div>
            </td>

            <td>
              <div class="form-group"
                ng-class="{
                    'has-success': $displayContent.readyForProd()
                  }">
                <!-- booleans -->
                <select ng-switch-when="boolean"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'staging' ]"
                      disabled
                    >
                  <option>true</option>
                  <option>false</option>
                </select>
                <!-- numbers -->
                <input ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                      type="number"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'staging' ]"
                      disabled
                    />
                <!-- objects as JSON -->
                <textarea ng-switch-when="json"
                          id="content-input-{{$displayContent.key}}-prod"
                          class="form-control"
                          rows="{{$displayContent.value[ 'staging' ].split('\n').length}}"
                          ng-model="$displayContent.value[ 'staging' ]"
                          disabled
                        ></textarea>
                <!-- multi-line text -->
                <textarea ng-switch-when="multi_line_text_field"
                          id="content-input-{{$displayContent.key}}-prod"
                          class="form-control"
                          rows="{{$displayContent.value[ 'staging' ].split('\n').length}}"
                          ng-model="$displayContent.value[ 'staging' ]"
                          disabled
                        ></textarea>
                <!-- Default to single-line text input -->
                <input ng-switch-default
                      type="text"
                      id="content-input-{{$displayContent.key}}-prod"
                      class="form-control"
                      ng-model="$displayContent.value[ 'staging' ]"
                      disabled
                    />

              </div>
            </td>

            <td>
              <div class="form-group"
                ng-class="{
                  'has-error' : !$displayContent.isValid( 'staging' ) && !$displayContent.isBlank( 'staging' ),
                  'has-success': $displayContent.readyToStage()
                }">
                <!-- booleans -->
                <select ng-switch-when="boolean"
                      id="content-input-{{$displayContent.key}}-staging"
                      class="form-control"
                      ng-model="$displayContent.editValue[ 'staging' ]"
                    >
                  <option>true</option>
                  <option>false</option>
                </select>
                <!-- numbers -->
                <input ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                      type="number"
                      id="content-input-{{$displayContent.key}}-staging"
                      class="form-control"
                      ng-model="$displayContent.editValue[ 'staging' ]"
                    />
                <!-- objects as JSON -->
                <textarea ng-switch-when-separator="|" ng-switch-when="json|dimension|rating|volume|weight"
                          id="content-input-{{$displayContent.key}}-staging"
                          class="form-control"
                          rows="{{$displayContent.editValue[ 'staging' ].split('\n').length}}"
                          ng-model="$displayContent.editValue[ 'staging' ]"
                        ></textarea>
                <!-- multi-line text -->
                <textarea ng-switch-when="multi_line_text_field"
                          id="content-input-{{$displayContent.key}}-staging"
                          class="form-control"
                          rows="{{$displayContent.editValue[ 'staging' ].split('\n').length}}"
                          ng-model="$displayContent.editValue[ 'staging' ]"
                        ></textarea>
                <!-- Default to single-line text input -->
                <input ng-switch-default
                      type="text"
                      id="content-input-{{$displayContent.key}}-staging"
                      class="form-control"
                      ng-model="$displayContent.editValue[ 'staging' ]"
                    />

                <!-- Error messages -->
                <span ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                  ng-hide="$displayContent.isValid( 'staging' ) || $displayContent.isBlank( 'staging' )"
                  class="text-danger"
                  >Not a number</span>
                <span ng-switch-when-separator="|" ng-switch-when="json|dimension|rating|volume|weight"
                  ng-hide="$displayContent.isValid( 'staging' ) || $displayContent.isBlank( 'staging' )"
                  class="text-danger"
                  >Not valid JSON</span>
              </div>
              <div ng-show="$displayContent.isDirty( 'staging' )">
                <button tabIndex="-1" class="btn btn-xs btn-warning" ng-click="$displayContent.revert( 'staging' )">Revert</button>
              </div>
            </td>


            <td ng-show="$displayContent.readyToStage()">
              <button tabIndex="-1" class="btn btn-xs btn-success" ng-click="$ctrl.stageContent( $displayContent )">Stage</button>
            </td>

            <td ng-show="$displayContent.readyForProd()">
              <button tabIndex="-1" class="btn btn-xs btn-warning" ng-click="$ctrl.deployToProd( $displayContent )">Deploy to production</button>
            </td>

          </tr>
        </tbody>

      </table>


    </div>
  </div>

  <div class="col-xs-12" ng-show="$ctrl.waitingForResponse">
    <div class="center-block loader"></div>
    <h2 class="text-center">Please wait...</h2>
  </div>

  <div class="row well" ng-show="$ctrl.showDeveloper">

    <h2>New Content (development use only)</h2>


    <table class="table table-striped">

      <thead><tr>
        <th>Namespace</th>
        <th>Key</th>
        <th>Type</th>
        <th>Value</th>
        <th></th> <!-- create -->
      </tr></thead>

      <tbody>
        <!-- The new metafield-->
        <tr ng-switch="$ctrl.newContent.type">
          <td>
            <input class="form-control" ng-model="$ctrl.newContent.namespace" ng-value="'wsn_content'" disabled/>
          </td>
          <td
            ng-class="{
              'has-error' : !$ctrl.newContent.key && !$ctrl.newContent.isBlank( 'staging' )
            }">
            <input class="form-control" ng-model="$ctrl.newContent.key"/>
          </td>
          <td
            ng-class="{
              'has-error' : !$ctrl.newContent.type && !$ctrl.newContent.isBlank( 'staging' )
            }">
            <select class="form-control" ng-model="$ctrl.newContent.type">
              <option ng-repeat="opt in $ctrl.metafieldTypeOptions">{{ opt }}</option>
            </select>
          </td>
          <td>
            <div class="form-group" ng-class="{
              'has-error' : !$ctrl.newContent.isValid( 'staging' ) && !$ctrl.newContent.isBlank( 'staging' ),
              'has-success': $ctrl.newContent.isDirty( 'staging' ) && $ctrl.newContent.isValid( 'staging' )
            }">
              <!-- booleans -->
              <select ng-switch-when="boolean"
                    id="content-input-{{$displayContent.key}}-new"
                    class="form-control"
                    ng-model="$ctrl.newContent.editValue.staging"
                  >
                <option>true</option>
                <option>false</option>
              </select>
              <!-- numbers -->
              <input ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                    type="number"
                    id="content-input-{{$displayContent.key}}-new"
                    class="form-control"
                    ng-model="$ctrl.newContent.editValue.staging"
                  />
              <!-- objects as JSON -->
              <textarea ng-switch-when-separator="|" ng-switch-when="json|dimension|rating|volume|weight"
                        id="content-input-{{$displayContent.key}}-new"
                        class="form-control"
                        rows="{{$ctrl.newContent.editValue.staging.split('\n').length}}"
                        ng-model="$ctrl.newContent.editValue.staging"
                      ></textarea>
              <!-- multi-line text -->
              <textarea ng-switch-when="multi_line_text_field"
                        id="content-input-{{$displayContent.key}}-new"
                        class="form-control"
                        rows="{{$ctrl.newContent.editValue.staging.split('\n').length}}"
                        ng-model="$ctrl.newContent.editValue.staging"
                      ></textarea>
              <!-- If type hasn't been chosen yet -->
              <input ng-switch-when="undefined"
                    type="text"
                    id="content-input-{{$displayContent.key}}-new"
                    class="form-control"
                    ng-model="$ctrl.newContent.editValue.staging"
                    disabled
                  />
              <!-- Default to single-line text input -->
              <input ng-switch-default
                    type="text"
                    id="content-input-{{$displayContent.key}}-new"
                    class="form-control"
                    ng-model="$ctrl.newContent.editValue.staging"
                  />


              <!-- Error messages -->
              <span ng-switch-when-separator="|" ng-switch-when="number_integer|number_decimal"
                  ng-hide="$ctrl.newContent.isValid( 'staging' ) || $ctrl.newContent.isBlank( 'staging' )"
                  class="text-danger"
                  >Not a number</span>
              <span ng-switch-when-separator="|" ng-switch-when="json|dimension|rating|volume|weight"
                  ng-hide="$ctrl.newContent.isValid( 'staging' ) || $ctrl.newContent.isBlank( 'staging' )"
                  class="text-danger"
                >Not valid JSON</span>
            </div>
          </td>
          <td>
            <button
                tabIndex="-1"
                class="btn btn-xs btn-success"
                ng-click="$ctrl.createContentMetafield( $ctrl.newContent )"
                ng-disabled="!$ctrl.newContent.key || !$ctrl.newContent.type || !$ctrl.newContent.isValid( 'staging' )"
              >Save</button>
          </td>
          <td>
            <!-- No revert button -->
          </td>
        </tr>
      </tbody>

    </table>

  </div>


</div>
