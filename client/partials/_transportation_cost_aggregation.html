<div class="container" ng-controller="TransportationCostAggregationCtrl as $ctrl">
  <h2>Transportation costs</h2>

  <div class="row well" style="display: flex; flex-direction: column">

      <div style="display: flex; justify-content: space-around; align-items: center;">

        <div class="form-group">
          <label for="startDateRangeInput">Start Date (start of day)</label>
          <input
            type="date"
            class="form-control"
            id="startDateRangeInput"
            ng-model="$ctrl.inputs.aggregationStartDate"
            min="{{ $ctrl.inputs.aggregationMinDate }}"
            max="{{ $ctrl.inputs.aggregationMaxDate }}"
            ng-change="$ctrl.refreshAggregation()"
          />
        </div>

        <div class="form-group">
          <label for="startDateRangeInput">End Date (end of day)</label>
          <input
            type="date"
            class="form-control"
            id="startDateRangeInput"
            ng-model="$ctrl.inputs.aggregationEndDate"
            min="{{ $ctrl.inputs.aggregationMinDate }}"
            max="{{ $ctrl.inputs.aggregationMaxDate }}"
            ng-change="$ctrl.refreshAggregation()"
          />
        </div>

        <div class="form-group">
          <label for="periodInput">Period</label>
          <select class="form-control" ng-model="$ctrl.inputs.aggregationPeriod" ng-change="$ctrl.refreshAggregation()">
            <option ng-repeat="period in $ctrl.inputs.periodOptions">{{ period }}</option>
          </select>
        </div>

      </div>

      <table class="table table-striped">
        <thead><tr>
          <th>Date range</th>
          <th>Cost</th>
        </tr></thead>
        <tbody>
          <tr ng-repeat="$row in $ctrl.aggregationRows track by $index">
            <td>{{$row.displayDate}} - <span>{{ $last ? $ctrl.displayEndDate : $ctrl.aggregationRows[$index+1].displayDate }}</span></td>
            <td>{{$row.cost.toFixed(2)}}</td>
          </tr>
        </tbody>
      </table>
  </div>

</div>
