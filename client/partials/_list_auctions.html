<div class="container" id="contact" ng-controller="ListAuctionsCtrl as $ctrl">
	<div class="row well">
		<h2>Auctions</h2>
		<fieldset class="col-xs-12 box-border">
			<legend class="box-border">Filter</legend>
			<div class="form-group col-xs-12 col-sm-6">
				<label for="auctionLotIdFilter">Handle (Lot ID)</label>
				<input class="form-control" name="auctionLotIdFilter" ng-model="$ctrl.auctionLotId" ng-keyup="$ctrl.update()">
			</div>
			<div class="form-group col-xs-12 col-sm-6">
				<label for="auctionStatusFilter">Status</label>
				<select class="form-control" name="auctionStatusFilter" ng-model="$ctrl.auctionStatus" ng-change="$ctrl.update()">
					<option ng-repeat="status in $ctrl.auctionStatusOptions">{{status}}</option>
				</select>
			</div>
		</fieldset>
		<table class="table table-striped">
			<thead><tr>
				<th>Handle/Lot ID</th>
				<th>Total Status</th>
				<th>Start Date</th>
				<th>End date</th>
			</tr></thead>
			<tbody>
				<tr ng-repeat="auction in $ctrl.auctions">
					<td ng-if="!auction.inLotDb">{{auction.lot_id}}</td>
					<td ng-if="auction.inLotDb"><a ng-href="lots/view/{{auction.lotDbId}}">{{auction.lot_id}}</a></td>
				    <td>{{auction.auction_status}}</td>
				    <td>{{auction.readableStartDate}}</td>
				    <td>{{auction.readableEndDate}}</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
