<div class="container" ng-controller="ListPendingOrdersController as ctrl">
  <h1>Pending Orders</h1>
	<div class="row well">
    <table class="table table-striped">
			<thead><tr>
				<th>Order #</th>
        <th>Date</th>
        <th>Channel</th>
        <th>Status</th>
      </tr></thead>
      <tbody>	
				<tr ng-repeat="order in ctrl.orders">
					<td><a ng-href="/orders/pick/{{order.orderId}}">{{order.orderNumber}}</a></td>
          <td>{{ order.displayDate }}</td>
          <td>{{ order.channel }}</td>
          <td>{{ order.status }}</td>
				</tr>
      </tbody>
    </table>
  </div>
</div>
